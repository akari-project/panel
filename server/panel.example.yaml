# panel 配置示例（internal/config）。环境变量优先于本文件，例如 PANEL_DATABASE_URL、PANEL_HTTP_LISTEN。
# 加密主密钥只从环境变量读取：PANEL_MASTER_KEY="<key_id>:<base64 32 字节>"，轮换期间另设 PANEL_MASTER_KEY_PREVIOUS。
env: prod                      # dev | test | prod
log:
  level: info                  # debug | info | warn | error
  format: json                 # json | text
database:
  url: postgres://panel:panel@localhost:5432/panel?sslmode=disable
  max_conns: 10
http:
  listen: ":8080"              # api；all 模式下全部角色共用此端口
  trusted_proxies: []          # 只有来自这些 CIDR 的请求才采信 X-Forwarded-For / -Proto（spec/40 DEP-13）
  shutdown_timeout: 30s
gateway:
  listen: ":8081"              # 单独启动 gateway 时使用
  hosts: [gateway.example.com] # all 模式下按 Host 分给网关
worker:
  listen: "127.0.0.1:8082"     # 单独启动 worker 时 /healthz 的地址；留空不监听
site:
  name: Akari
  source_url: https://github.com/akari-project/panel/tree/{commit}   # 页脚“源代码”链接（spec/01 ARC-04）
ui:
  portal:
    hosts: [example.com]       # 留空匹配任意 Host
    path_prefix: /
  admin:
    hosts: [console.example.com]
    path_prefix: /
    # api_base_url: https://console.example.com   # 留空时取请求来源加路径前缀
