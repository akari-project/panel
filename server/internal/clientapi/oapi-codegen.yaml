# oapi-codegen 配置（make gen）。输入是 tools/oapiprep 改写后的 panel-spec 客户端接口（spec/30），
# 输出不手改。include-operation-ids 列出已实现的操作，随各任务增加；未列出的路由返回 404 not_found。
package: gen
generate:
  std-http-server: true
  strict-server: true
  models: true
compatibility:
  always-prefix-enum-values: true
output-options:
  nullable-type: true
  overlay:
    path: internal/clientapi/overlay.yaml
  include-operation-ids:
    - getMe
    - createAccount
    - verifyEmail
    - resendVerification
    - requestPasswordReset
    - confirmPasswordReset
    - createSession
    - createSessionNonce
    - deleteCurrentSession
    - issueToken
    - startTotpEnrollment
    - activateTotp
    - disableTotp
    - regenerateRecoveryCodes
    - reauthenticate
    - changePassword
output: internal/clientapi/gen/api.gen.go
