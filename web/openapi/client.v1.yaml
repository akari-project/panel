                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
              example:
                items:
                - id: 0192f0c4-ca00-7000-8000-0000000b0001
                  number: TCK-20261001-H6WD2C
                  subject: 支付成功但套餐未开通
                  category: billing
                  status: waiting_user
                  created_at: '2026-10-01T10:10:00+08:00'
                  updated_at: '2026-10-01T11:02:00+08:00'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [support]
      operationId: createTicket
      summary: 创建工单
      description: 附件先通过 `POST /v1/support/attachments` 上传，每条消息最多 4 个（OPS-10）。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category, body]
              properties:
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  type: string
                  maxLength: 32
                  description: 分类键，由运营者配置
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                attachment_ids:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    format: uuid
            example:
              subject: 支付成功但套餐未开通
              category: billing
              body: 订单 ORD-20261001-P3ZG7K 已在支付宝付款，页面仍显示待支付。
              attachment_ids: [0192f0c4-cc00-7000-8000-0000000d0001]
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
              example:
                id: 0192f0c4-ca00-7000-8000-0000000b0001
                number: TCK-20261001-H6WD2C
                subject: 支付成功但套餐未开通
                category: billing
                status: open
                created_at: '2026-10-01T10:10:00+08:00'
                updated_at: '2026-10-01T10:10:00+08:00'
                messages:
                - id: 0192f0c4-cb00-7000-8000-0000000c0001
                  author: user
                  body: 订单 ORD-20261001-P3ZG7K 已在支付宝付款，页面仍显示待支付。
                  attachments:
                  - id: 0192f0c4-cc00-7000-8000-0000000d0001
                    filename: alipay-receipt.png
                    content_type: image/png
                    bytes_size: 184320
                    created_at: '2026-10-01T10:09:30+08:00'
                  created_at: '2026-10-01T10:10:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support/tickets/{id}:
    get:
      tags: [support]
      operationId: getTicket
      summary: 工单详情与消息
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
              example:
                id: 0192f0c4-ca00-7000-8000-0000000b0001
                number: TCK-20261001-H6WD2C
                subject: 支付成功但套餐未开通
                category: billing
                status: waiting_user
                created_at: '2026-10-01T10:10:00+08:00'
                updated_at: '2026-10-01T11:02:00+08:00'
                messages:
                - id: 0192f0c4-cb00-7000-8000-0000000c0001
                  author: user
                  body: 订单 ORD-20261001-P3ZG7K 已在支付宝付款，页面仍显示待支付。
                  attachments: []
                  created_at: '2026-10-01T10:10:00+08:00'
                - id: 0192f0c4-cb00-7000-8000-0000000c0002
                  author: staff
                  body: 已为您补单开通，请刷新页面确认。
                  attachments: []
                  created_at: '2026-10-01T11:02:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support/tickets/{id}/messages:
    post:
      tags: [support]
      operationId: replyTicket
      summary: 回复工单
      description: |
        OPS-11：用户回复后工单变为 `open`；关闭超过 30 天的工单不能回复，返回 409 `invalid_state`，需新建工单。
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                attachment_ids:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    format: uuid
            example:
              body: 已确认开通，谢谢。
      responses:
        '201':
          description: 已回复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
              example:
                id: 0192f0c4-cb00-7000-8000-0000000c0003
                author: user
                body: 已确认开通，谢谢。
                attachments: []
                created_at: '2026-10-01T11:10:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support/attachments:
    post:
      tags: [support]
      operationId: uploadAttachment
      summary: 上传工单附件
      description: |
        OPS-10：只允许 PNG、JPEG、WebP，按文件内容识别类型；单个不超过 5 MiB，超限返回 413 `payload_too_large`；
        类型不符返回 400，`errors[].code` 为 `invalid_format`。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  maxLength: 5242880
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
              example:
                id: 0192f0c4-cc00-7000-8000-0000000d0001
                filename: alipay-receipt.png
                content_type: image/png
                bytes_size: 184320
                created_at: '2026-10-01T10:09:30+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support/attachments/{id}:
    get:
      tags: [support]
      operationId: downloadAttachment
      summary: 下载工单附件
      description: |
        OPS-10：只有工单所有人可以下载，他人与不存在的附件都返回 404（CONV-15）。模块关闭时返回 404。
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 附件内容
          headers:
            Content-Disposition:
              description: 恒为 `attachment`
              schema:
                type: string
              example: attachment; filename="alipay-receipt.png"
            X-Content-Type-Options:
              description: 恒为 `nosniff`
              schema:
                type: string
                const: nosniff
              example: nosniff
            Cache-Control:
              description: '`private, no-store`'
              schema:
                type: string
              example: private, no-store
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
              example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
              example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8U
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
              example: UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/referrals:
    get:
      tags: [referrals]
      operationId: getReferrals
      summary: 邀请返利概要
      description: spec/13 13.5、OPS-06。返利先冻结（默认 14 天），期满转入余额。模块关闭时返回 404。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referrals'
              example:
                referral_code: K7Q2XM
                invite_url: https://portal.example.invalid/register?invite=K7Q2XM
                invited_count: 5
                frozen_minor: 600
                settled_minor: 1800
                currency: CNY
                rule:
                  rate_bps: 1000
                  is_first_order_only: true
                  cap_minor: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics:
    post:
      tags: [diagnostics]
      operationId: submitDiagnostics
      summary: 提交诊断日志
      description: |
        用户主动提交；模块默认关闭，关闭时返回 404（OPS-08）。客户端在上传前去除令牌、凭据、完整 IP 与访问目标
        （CONV-24）。日志文件不超过 5 MiB，超限返回 413。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [platform, app_version, log]
              properties:
                platform:
                  $ref: '#/components/schemas/ClientPlatform'
                app_version:
                  type: string
                  maxLength: 32
                description:
                  type: string
                  maxLength: 2000
                log:
                  type: string
                  contentMediaType: application/gzip
                  maxLength: 5242880
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
              example:
                id: 0192f0c4-da00-7000-8000-0000000e0001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public
      description: 自研客户端。访问令牌有效期 15 分钟，受众为 `client`（AUTH-06）。
    cookie:
      type: apiKey
      in: cookie
      name: __Host-access_token
      description: |
        用户中心。登录时以 HttpOnly、Secure、SameSite=Strict Cookie 下发访问令牌；刷新令牌 Cookie
        （`__Host-refresh_token`）只随 `POST /v1/oauth/token` 发送（AUTH-08）。
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0192f0c4-9b00-7000-8000-000000060002
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键（CONV-12），UUID
      schema:
        type: string
        format: uuid
      example: 7d7c2b0e-4f6a-4e1b-9a3c-2d5e8f1a0b4c
    Limit:
      name: limit
      in: query
      description: 每页条数（CONV-11）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      description: 不透明的 base64url 游标，取自上一页的 `next_cursor`
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
      example: MjAyNi0wOS0wMVQwMTozMDowMFp8MDE5MmYwYzQtOWIwMA
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次响应的 `ETag`；未变化时返回 304（CONV-13）
      schema:
        type: string
      example: '"b1946ac92492d2347c6235b4d2611184"'
  headers:
    ETag:
      description: 强 ETag
      schema:
        type: string
      example: '"b1946ac92492d2347c6235b4d2611184"'
    RetryAfter:
      description: 建议的重试等待秒数
      schema:
        type: integer
        minimum: 0
      example: 30
    UsageUserinfoHeader:
      description: |
        第三方客户端依赖的标准响应头（API-01 唯一例外）：`upload`、`download` 为本周期计费字节，`total` 为额度字节，
        `expire` 为到期的 Unix 秒（EXP-05、EXP-06）。按实时用量生成。
      schema:
        type: string
      example: upload=1610612736; download=95026151424; total=214748364800; expire=1793496730
    ProfileUpdateInterval:
      description: 建议的更新间隔（小时），默认 24
      schema:
        type: integer
        minimum: 1
      example: 24
    CacheControlPrivateNoCache:
      description: '`private, no-cache`'
      schema:
        type: string
      example: private, no-cache
  responses:
    Problem:
      description: 其他错误（RFC 9457 problem details）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://api.example.invalid/problems/internal
                title: Internal Error
                status: 500
                code: internal
                request_id: req_0192f0c4ffa07c3d
            service_unavailable:
              value:
                type: https://api.example.invalid/problems/service_unavailable
                title: Service Unavailable
                status: 503
                code: service_unavailable
                request_id: req_0192f0c4ffa07c3e
    NotModified:
      description: 未修改
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: 参数错误（`invalid_request`），`errors[]` 给出逐项原因
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_request:
              value:
                type: https://api.example.invalid/problems/invalid_request
                title: Bad Request
                status: 400
                code: invalid_request
                request_id: req_0192f0c4ffa07c40
                errors:
                - field: password
                  code: too_short
            invalid_code:
              value:
                type: https://api.example.invalid/problems/invalid_request
                title: Bad Request
                status: 400
                code: invalid_request
                request_id: req_0192f0c4ffa07c41
                errors:
                - field: code
                  code: invalid_code
            incorrect:
              value:
                type: https://api.example.invalid/problems/invalid_request
                title: Bad Request
                status: 400
                code: invalid_request
                request_id: req_0192f0c4ffa07c5a
                errors:
                - field: password
                  code: incorrect
    Unauthenticated:
      description: 未登录或令牌失效（`unauthenticated`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/unauthenticated
            title: Unauthorized
            status: 401
            code: unauthenticated
            request_id: req_0192f0c4ffa07c42
    MfaRequired:
      description: 需要重新验证（`mfa_required`，AUTH-23），或未登录（`unauthenticated`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mfa_required:
              value:
                type: https://api.example.invalid/problems/mfa_required
                title: Reauthentication Required
                status: 401
                code: mfa_required
                request_id: req_0192f0c4ffa07c43
                challenge_id: 0192f0c4-3a00-7000-8000-00000000e002
                methods: [totp, recovery_code]
            unauthenticated:
              value:
                type: https://api.example.invalid/problems/unauthenticated
                title: Unauthorized
                status: 401
                code: unauthenticated
                request_id: req_0192f0c4ffa07c44
    LoginUnauthorized:
      description: 需要二次验证（`mfa_required`，AUTH-20），或邮箱、密码、二次验证码错误（`unauthenticated`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mfa_required:
              value:
                type: https://api.example.invalid/problems/mfa_required
                title: Two-factor Authentication Required
                status: 401
                code: mfa_required
                request_id: req_0192f0c4ffa07c45
                challenge_id: 0192f0c4-3a00-7000-8000-00000000e001
                methods: [totp, recovery_code]
            unauthenticated:
              value:
                type: https://api.example.invalid/problems/unauthenticated
                title: Unauthorized
                status: 401
                code: unauthenticated
                detail: 邮箱或密码错误
                request_id: req_0192f0c4ffa07c46
    AccountSuspended:
      description: 账号已暂停或正在注销（`account_suspended`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/account_suspended
            title: Account Suspended
            status: 403
            code: account_suspended
            request_id: req_0192f0c4ffa07c47
    RegistrationClosed:
      description: 注册已关闭，或策略要求邀请码而请求未提供（`registration_closed`，AUTH-02）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/registration_closed
            title: Registration Closed
            status: 403
            code: registration_closed
            request_id: req_0192f0c4ffa07c48
    EmailUnverified:
      description: 邮箱未验证，不能下单（`email_unverified`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/email_unverified
            title: Email Unverified
            status: 403
            code: email_unverified
            request_id: req_0192f0c4ffa07c49
    NotFound:
      description: 不存在或无权查看；模块关闭时同样返回（`not_found`，CONV-15、OPS-08）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/not_found
            title: Not Found
            status: 404
            code: not_found
            request_id: req_0192f0c4ffa07c4a
    Conflict:
      description: 同一幂等键的请求仍在处理（`conflict`），稍后按 `Retry-After` 重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/conflict
            title: Conflict
            status: 409
            code: conflict
            request_id: req_0192f0c4ffa07c4b
    InvalidState:
      description: 资源当前状态不允许该操作（`invalid_state`），或同一幂等键的请求仍在处理（`conflict`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_state:
              value:
                type: https://api.example.invalid/problems/invalid_state
                title: Invalid State
                status: 409
                code: invalid_state
                request_id: req_0192f0c4ffa07c4c
            conflict:
              value:
                type: https://api.example.invalid/problems/conflict
                title: Conflict
                status: 409
                code: conflict
                request_id: req_0192f0c4ffa07c4d
    QuoteConflict:
      description: 需要生效中的权益（`entitlement_required`）、存在下一段或幂等请求处理中（`conflict`）、权益已暂停（`invalid_state`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            entitlement_required:
              value:
                type: https://api.example.invalid/problems/entitlement_required
                title: Entitlement Required
                status: 409
                code: entitlement_required
                request_id: req_0192f0c4ffa07c4e
            conflict:
              value:
                type: https://api.example.invalid/problems/conflict
                title: Conflict
                status: 409
                code: conflict
                detail: 请先取消下一段
                request_id: req_0192f0c4ffa07c4f
            invalid_state:
              value:
                type: https://api.example.invalid/problems/invalid_state
                title: Invalid State
                status: 409
                code: invalid_state
                request_id: req_0192f0c4ffa07c50
    OrderConflict:
      description: 报价过期（`quote_expired`）、支付渠道不可用（`payment_unavailable`）或幂等请求处理中（`conflict`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            quote_expired:
              value:
                type: https://api.example.invalid/problems/quote_expired
                title: Quote Expired
                status: 409
                code: quote_expired
                request_id: req_0192f0c4ffa07c51
            payment_unavailable:
              value:
                type: https://api.example.invalid/problems/payment_unavailable
                title: Payment Unavailable
                status: 409
                code: payment_unavailable
                request_id: req_0192f0c4ffa07c52
            conflict:
              value:
                type: https://api.example.invalid/problems/conflict
                title: Conflict
                status: 409
                code: conflict
                request_id: req_0192f0c4ffa07c53
    RedemptionConflict:
      description: 套餐兑换码与当前权益不匹配（`entitlement_required`），或幂等请求处理中（`conflict`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            entitlement_required:
              value:
                type: https://api.example.invalid/problems/entitlement_required
                title: Entitlement Required
                status: 409
                code: entitlement_required
                request_id: req_0192f0c4ffa07c54
            conflict:
              value:
                type: https://api.example.invalid/problems/conflict
                title: Conflict
                status: 409
                code: conflict
                request_id: req_0192f0c4ffa07c55
    PayloadTooLarge:
      description: 请求体或附件超过上限（`payload_too_large`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/payload_too_large
            title: Payload Too Large
            status: 413
            code: payload_too_large
            request_id: req_0192f0c4ffa07c56
    IdempotencyKeyReused:
      description: 同一幂等键用于不同的请求体（`idempotency_key_reused`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/idempotency_key_reused
            title: Idempotency Key Reused
            status: 422
            code: idempotency_key_reused
            request_id: req_0192f0c4ffa07c57
    UpgradeRequired:
      description: 客户端版本过低（`upgrade_required`，API-03）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/upgrade_required
            title: Upgrade Required
            status: 426
            code: upgrade_required
            request_id: req_0192f0c4ffa07c58
    TooManyRequests:
      description: 超过限流（`rate_limited`，API-04）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.invalid/problems/rate_limited
            title: Too Many Requests
            status: 429
            code: rate_limited
            request_id: req_0192f0c4ffa07c59
    OAuthError:
      description: OAuth 错误（RFC 6749 §5.2、RFC 8628 §3.5；CONV-16 例外）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            authorization_pending:
              value:
                error: authorization_pending
                error_description: 等待用户批准
            slow_down:
              value:
                error: slow_down
                error_description: 轮询过快，请把间隔增加 5 秒
            expired_token:
              value:
                error: expired_token
                error_description: 设备码已过期
            invalid_grant:
              value:
                error: invalid_grant
                error_description: 刷新令牌无效或已被使用
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details（CONV-16）
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: 参数错误的逐项原因（仅 `invalid_request`）
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: 字段路径，如 `device.platform`
              code:
                $ref: '#/components/schemas/FieldErrorCode'
        challenge_id:
          type: string
          format: uuid
          description: 仅 `mfa_required`：二次验证挑战 ID，5 分钟有效（AUTH-20）
        methods:
          type: array
          description: 仅 `mfa_required`：可用的二次验证方式
          items:
            $ref: '#/components/schemas/MfaMethod'
    ProblemCode:
      type: string
      description: 错误码，取值见 spec/02 CONV-16
      enum:
      - invalid_request
      - unauthenticated
      - mfa_required
      - forbidden
      - email_unverified
      - registration_closed
      - account_suspended
      - not_found
      - conflict
      - invalid_state
      - quote_expired
      - entitlement_required
      - device_limit_reached
      - payment_unavailable
      - kernel_protocol_unsupported
      - payload_too_large
      - idempotency_key_reused
      - upgrade_required
      - precondition_required
      - rate_limited
      - internal
      - service_unavailable
    FieldErrorCode:
      type: string
      description: '`errors[].code`，取值见 spec/02 CONV-16'
      enum:
      - required
      - invalid_format
      - too_short
      - too_long
      - out_of_range
      - not_allowed
      - invalid_code
      - incorrect
      - expired
      - exhausted
      - taken
    OAuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unsupported_grant_type
          - authorization_pending
          - slow_down
          - access_denied
          - expired_token
        error_description:
          type: string
    MfaMethod:
      type: string
      enum: [totp, passkey, recovery_code]
    Accepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    Currency:
      type: string
      description: ISO 4217 货币代码
      pattern: ^[A-Z]{3}$
    NextCursor:
      type: [string, 'null']
      description: 下一页游标；最后一页为 null
    ClientPlatform:
      type: string
      description: 自研客户端平台
      enum: [ios, android, windows, macos, linux]
    Platform:
      type: string
      description: 设备平台；`web` 为浏览器中的用户中心
      enum: [ios, android, windows, macos, linux, web, other]
    DeviceInfo:
      type: object
      required: [platform]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        model:
          type: string
          maxLength: 100
        app_version:
          type: string
          maxLength: 32
        public_key:
          type: string
          description: Ed25519 公钥（SPKI DER 的 base64）；非 web 设备必填（AUTH-10）
        device_id:
          type: string
          format: uuid
          description: 已有设备的 ID；与 `device_proof` 一起提交以复用原设备记录与名额
        device_proof:
          type: object
          description: 设备证明（AUTH-10）：`nonce` 取自 `POST /v1/sessions/nonces`，`signature` 为该设备 Ed25519 私钥对该 nonce 字符串 UTF-8 字节的签名（base64）
          required: [nonce, signature]
          properties:
            nonce:
              type: string
            signature:
              type: string
    PasswordLogin:
      type: object
      title: 第一步：邮箱与密码
      additionalProperties: false
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        device:
          $ref: '#/components/schemas/DeviceInfo'
        captcha_token:
          type: string
    MfaLoginTotp:
      type: object
      title: 第二步：TOTP
      additionalProperties: false
      required: [challenge_id, device, totp_code]
      properties:
        challenge_id:
          type: string
          format: uuid
        device:
          $ref: '#/components/schemas/DeviceInfo'
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
    MfaLoginPasskey:
      type: object
      title: 第二步：Passkey
      additionalProperties: false
      required: [challenge_id, device, webauthn_assertion]
      properties:
        challenge_id:
          type: string
          format: uuid
        device:
          $ref: '#/components/schemas/DeviceInfo'
        webauthn_assertion:
          type: object
          additionalProperties: true
          description: AuthenticationResponseJSON（WebAuthn Level 3）
    MfaLoginRecoveryCode:
      type: object
      title: 第二步：恢复码
      additionalProperties: false
      required: [challenge_id, device, recovery_code]
      properties:
        challenge_id:
          type: string
          format: uuid
        device:
          $ref: '#/components/schemas/DeviceInfo'
        recovery_code:
          type: string
          maxLength: 32
    Reauthentication:
      oneOf:
      - type: object
        title: 密码
        additionalProperties: false
        required: [password]
        properties:
          challenge_id:
            type: string
            format: uuid
          password:
            type: string
            maxLength: 128
      - type: object
        title: TOTP
        additionalProperties: false
        required: [totp_code]
        properties:
          challenge_id:
            type: string
            format: uuid
          totp_code:
            type: string
            pattern: ^[0-9]{6}$
      - type: object
        title: Passkey
        additionalProperties: false
        required: [webauthn_assertion]
        properties:
          challenge_id:
            type: string
            format: uuid
          webauthn_assertion:
            type: object
            additionalProperties: true
            description: AuthenticationResponseJSON（WebAuthn Level 3）
      - type: object
        title: 恢复码
        additionalProperties: false
        required: [recovery_code]
        properties:
          challenge_id:
            type: string
            format: uuid
          recovery_code:
            type: string
            maxLength: 32
    CredentialStatus:
      type: string
      description: |
        本设备代理凭据的状态：`issued` 已下发；`device_limit_reached` 设备数已达上限（AUTH-14）；
        `entitlement_inactive` 没有可下发凭据的权益（免费账号、`over_quota`、`suspended`）；`web_device` web 设备不生成凭据。
      enum: [issued, device_limit_reached, entitlement_inactive, web_device]
    Session:
      type: object
      required: [device_id, token_type, expires_in, credential_status]
      properties:
        device_id:
          type: string
          format: uuid
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
          description: 非 web 设备返回；web 设备以 Cookie 下发
        refresh_token:
          type: string
          description: 非 web 设备返回；web 设备以 Cookie 下发
        expires_in:
          type: integer
          description: 访问令牌有效秒数
        credential_status:
          $ref: '#/components/schemas/CredentialStatus'
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        device_id:
          type: string
          format: uuid
    RequestingDevice:
      type: object
      description: 请求登录的设备，供批准方核对（AUTH-24）
      required: [platform]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        model:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        ip_prefix:
          type: string
          description: /24（IPv4）或 /48（IPv6）前缀（CONV-24）
        region:
          type: [string, 'null']
          description: 按 IP 推断的所在地区；未配置 GeoIP 时为 null
    DeviceLinkCreated:
      type: object
      required: [id, qr_content, poll_token, check_digits, expires_in, interval]
      properties:
        id:
          type: string
          format: uuid
        qr_content:
          type: string
          description: 二维码内容（用户中心批准页地址）
        poll_token:
          type: string
          description: 作为 `device_code` 轮询 `POST /v1/oauth/token`
        check_digits:
          type: string
          pattern: ^[0-9]{2}$
          description: 在新设备屏幕上显示的校验数字
        expires_in:
          type: integer
        interval:
          type: integer
          description: 最短轮询间隔（秒）
    DeviceLink:
      type: object
      required: [id, status, device, candidate_digits, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, expired]
        device:
          $ref: '#/components/schemas/RequestingDevice'
        candidate_digits:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
            pattern: ^[0-9]{2}$
        expires_at:
          type: string
          format: date-time
    SignedConfig:
      type: object
      required: [payload, signature, key_id]
      properties:
        payload:
          type: object
          required: [min_version, announcement_version, features, api_endpoints, issued_at]
          properties:
            min_version:
              type: object
              description: 按平台的最低版本（API-03）
              propertyNames:
                $ref: '#/components/schemas/ClientPlatform'
              additionalProperties:
                type: string
            announcement_version:
              type: integer
              format: int64
            features:
              type: object
              description: 运营模块开关（OPS-08）。键名由 spec/13 OPS-08 规定，是 CONV-10 布尔字段须以 `is_`/`has_` 开头的例外。
              required: [announcements, articles, support, referrals, diagnostics]
              properties:
                announcements:
                  type: boolean
                articles:
                  type: boolean
                support:
                  type: boolean
                referrals:
                  type: boolean
                diagnostics:
                  type: boolean
            api_endpoints:
              type: array
              description: 主域名与备用域名
              items:
                type: string
                format: uri
            issued_at:
              type: string
              format: date-time
        signature:
          type: string
          contentEncoding: base64
          description: Ed25519 签名，对象为 `payload` 的 RFC 8785 规范化字节
        key_id:
          type: string
    Release:
      type: object
      required: [platform, version, url, sha256, signature, key_id, is_mandatory]
      properties:
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        version:
          type: string
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        signature:
          type: string
        key_id:
          type: string
        notes:
          type: string
        is_mandatory:
          type: boolean
        published_at:
          type: string
          format: date-time
    EntitlementStatus:
      type: string
      description: '`none` 无权益；`free` 持有免费套餐权益；其余为付费权益的状态（spec/11 11.1）'
      enum: [none, free, active, over_quota, suspended]
    Me:
      type: object
      required: [id, email, is_email_verified, status, locale, timezone, is_auto_renew, is_mfa_enabled, mfa_methods, entitlement_status, device_limit, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_email_verified:
          type: boolean
        status:
          type: string
          enum: [active, suspended, deleting]
        locale:
          type: string
        timezone:
          type: string
        is_auto_renew:
          type: boolean
          description: 余额自动续费开关（BIL-19）
        is_mfa_enabled:
          type: boolean
        mfa_methods:
          type: array
          items:
            $ref: '#/components/schemas/MfaMethod'
        entitlement_status:
          $ref: '#/components/schemas/EntitlementStatus'
        device_limit:
          type: integer
        referral_code:
          type: [string, 'null']
          description: 邀请码；返利模块关闭时仍可用于“仅邀请码”注册（AUTH-02）
        created_at:
          type: string
          format: date-time
        deletion_scheduled_at:
          type: [string, 'null']
          format: date-time
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
    Device:
      type: object
      required: [id, platform, created_at, is_current, has_credential]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        model:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, 'null']
          format: date-time
        ip_prefix:
          type: [string, 'null']
          description: 最近一次活跃的 IP 前缀（CONV-24）
        is_current:
          type: boolean
        has_credential:
          type: boolean
          description: 是否持有已下发的代理凭据；web 设备恒为假
    NotificationCategory:
      type: string
      enum: [security, transaction, reminder, marketing]
    NotificationChannel:
      type: string
      enum: [email, telegram]
    NotificationPreferences:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [category, channel, is_enabled, is_locked]
            properties:
              category:
                $ref: '#/components/schemas/NotificationCategory'
              channel:
                $ref: '#/components/schemas/NotificationChannel'
              is_enabled:
                type: boolean
              is_locked:
                type: boolean
                description: 安全类与交易类不可关闭
    Credential:
      type: object
      required: [id, secret]
      properties:
        id:
          type: string
          format: uuid
        secret:
          type: string
          description: 代理凭据值（UUID 或密码，按协议使用）
    Endpoint:
      type: object
      description: 一个可连接的入站
      required: [location_id, protocol, kernel, host, port, transport, tls]
      properties:
        location_id:
          type: string
          format: uuid
        protocol:
          type: string
          enum: [vless, vmess, trojan, shadowsocks, hysteria2, tuic, anytls]
        kernel:
          type: string
          enum: [singbox, xray]
          description: 所在内核；自研客户端只连接 sing-box 内核上的 Reality 入站（API-09）
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        transport:
          type: object
          required: [type]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [tcp, ws, grpc, httpupgrade, xhttp, mkcp, quic]
        tls:
          type: object
          required: [type]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [none, tls, reality]
            sni:
              type: string
            public_key:
              type: string
              description: 仅 Reality
            short_id:
              type: string
              description: 仅 Reality
        flow:
          type: string
          description: 仅 VLESS，例如 `xtls-rprx-vision`
    Configuration:
      type: object
      required: [version, credential_status, entitlement_status, credential, endpoints, rule_assets]
      properties:
        version:
          type: integer
          format: int64
        credential_status:
          $ref: '#/components/schemas/CredentialStatus'
        entitlement_status:
          $ref: '#/components/schemas/EntitlementStatus'
        credential:
          oneOf:
          - $ref: '#/components/schemas/Credential'
          - type: 'null'
          description: 本设备代理凭据；未下发时为 null
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        rule_assets:
          type: array
          items:
            type: object
            required: [name, digest]
            properties:
              name:
                type: string
              digest:
                type: string
                pattern: ^[a-f0-9]{64}$
                description: 通过 `GET /v1/assets/{digest}` 取得
    ExportLink:
      type: object
      required: [url, created_at]
      properties:
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
    LocationUsage:
      type: object
      required: [location_id, location_name, bytes_up, bytes_down, bytes_billed]
      properties:
        location_id:
          type: string
          format: uuid
        location_name:
          type: string
        bytes_up:
          type: integer
          format: int64
        bytes_down:
          type: integer
          format: int64
        bytes_billed:
          type: integer
          format: int64
          description: 乘以倍率后的计费字节
    Usage:
      type: object
      required: [cycle, daily, by_location]
      properties:
        cycle:
          oneOf:
          - type: object
            required: [starts_at, ends_at, bytes_used, bytes_limit, bytes_addon_remaining]
            properties:
              starts_at:
                type: string
                format: date-time
              ends_at:
                type: [string, 'null']
                format: date-time
                description: 重置规则为 `never` 时为权益到期时间，长期有效时为 null
              bytes_used:
                type: integer
                format: int64
              bytes_limit:
                type: integer
                format: int64
                description: 周期额度；0 表示不限
              bytes_addon_remaining:
                type: integer
                format: int64
                description: 流量包剩余字节
          - type: 'null'
        daily:
          type: array
          items:
            type: object
            required: [date, bytes_up, bytes_down, bytes_billed]
            properties:
              date:
                type: string
                format: date
              bytes_up:
                type: integer
                format: int64
              bytes_down:
                type: integer
                format: int64
              bytes_billed:
                type: integer
                format: int64
        by_location:
          type: array
          items:
            $ref: '#/components/schemas/LocationUsage'
    EventType:
      type: string
      description: '`GET /v1/me/events` 中 SSE 的 `event` 取值'
      enum: [quota_warning, plan_changed, profile_updated, device_revoked, session_revoked, announcement]
    EventMessage:
      type: object
      description: 一条 SSE 事件的逻辑结构：`id` 行、`event` 行与 JSON `data` 行
      required: [id, event, data]
      properties:
        id:
          type: string
        event:
          $ref: '#/components/schemas/EventType'
        data:
          type: object
          additionalProperties: true
    Location:
      type: object
      required: [id, name, region_code, load_percent, is_available, usage_multiplier]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region_code:
          type: string
          description: ISO 3166-1 alpha-2
          pattern: ^[A-Z]{2}$
        city:
          type: [string, 'null']
        load_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: 负载提示
        is_available:
          type: boolean
        is_accessible:
          type: [boolean, 'null']
          description: 当前权益能否使用；未认证时为 null
        usage_multiplier:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: 计费倍率，十进制字符串，例如 `1.50`
    PlanPrice:
      type: object
      required: [id, period, amount_minor, currency]
      properties:
        id:
          type: string
          format: uuid
        period:
          type: string
          enum: [month, quarter, half_year, year, one_time]
        period_days:
          type: [integer, 'null']
          description: 仅 `one_time`：有效天数；null 表示长期有效（BIL-09）
        amount_minor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
    Plan:
      type: object
      required: [id, name, kind, tier, bytes_per_cycle, device_limit, reset_policy, location_count, prices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [recurring, one_time, free]
        tier:
          type: integer
          minimum: 0
        bytes_per_cycle:
          type: integer
          format: int64
          description: 周期额度；0 表示不限
        device_limit:
          type: integer
        speed_limit_mbps:
          type: [integer, 'null']
        reset_policy:
          type: string
          enum: [purchase_anchor, calendar_month, never]
        location_count:
          type: integer
          description: 可访问的地区数
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanPrice'
    AddonKind:
      type: string
      description: '`data` 流量包；`devices` 额外设备名额（BIL-24）'
      enum: [data, devices]
    AddonPrice:
      type: object
      required: [id, kind, name, amount_minor, currency]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AddonKind'
        name:
          type: string
        bytes_total:
          type: [integer, 'null']
          format: int64
          description: 仅 `data`
        extra_devices:
          type: [integer, 'null']
          description: 仅 `devices`
        amount_minor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
    QuoteRequest:
      description: '`price_id` 与 `addon_price_id` 二选一'
      oneOf:
      - type: object
        title: 套餐
        additionalProperties: false
        required: [price_id]
        properties:
          price_id:
            type: string
            format: uuid
          mode:
            type: string
            enum: [auto, downgrade_immediate]
            default: auto
            description: '`downgrade_immediate` 请求立即降级（BIL-23）；其余由服务端判定场景'
          coupon_code:
            type: string
            maxLength: 64
          is_credit_applied:
            type: boolean
            default: true
            description: 是否用余额抵扣（预估额见 `Quote.credit_applied_minor`，以下单时冻结为准，ORD-15）
      - type: object
        title: 加购项
        additionalProperties: false
        required: [addon_price_id]
        properties:
          addon_price_id:
            type: string
            format: uuid
          coupon_code:
            type: string
            maxLength: 64
          is_credit_applied:
            type: boolean
            default: true
            description: 是否用余额抵扣（预估额见 `Quote.credit_applied_minor`，以下单时冻结为准，ORD-15）
    OrderType:
      type: string
      description: 购买场景（ORD-01）
      enum: [new, renew, upgrade, downgrade_scheduled, downgrade_immediate, addon]
    Quote:
      type: object
      required: [id, order_type, list_price_minor, remaining_value_minor, discount_minor, credit_applied_minor, credit_refund_minor, amount_due_minor, currency, is_locked_price_lost, expires_at]
      properties:
        id:
          type: string
          format: uuid
        order_type:
          $ref: '#/components/schemas/OrderType'
        plan_id:
          type: [string, 'null']
          format: uuid
        price_id:
          type: [string, 'null']
          format: uuid
        addon_price_id:
          type: [string, 'null']
          format: uuid
        list_price_minor:
          type: integer
          format: int64
          description: 原价
        remaining_value_minor:
          type: integer
          format: int64
          description: 剩余价值抵扣（11.4）
        discount_minor:
          type: integer
          format: int64
          description: 优惠
        credit_applied_minor:
          type: integer
          format: int64
          description: 余额抵扣（预估，以下单时冻结为准，ORD-15）
        credit_refund_minor:
          type: integer
          format: int64
          description: 剩余价值超出新价格、记入余额的部分
        amount_due_minor:
          type: integer
          format: int64
          description: 应付
        currency:
          $ref: '#/components/schemas/Currency'
        is_locked_price_lost:
          type: boolean
          description: 续费改换周期，原锁定价格将失效（BIL-08）
        entitlement_expires_at:
          type: [string, 'null']
          format: date-time
          description: 开通后的到期时间；长期有效为 null
        expires_at:
          type: string
          format: date-time
          description: 报价有效期（15 分钟）
    OrderStatus:
      type: string
      enum: [pending, paid, fulfilled, credited, cancelled, expired, refunded]
    PaymentMethod:
      type: string
      description: '`credit` 只在应付为 0 时合法（ORD-03）；`test` 仅开发与测试环境（PAY-11）'
      enum: [alipay_f2f, credit, test]
      default: alipay_f2f
    PaymentInstruction:
      type: object
      description: 支付指引（API-05）
      required: [method, expires_at]
      properties:
        method:
          type: string
          enum: [alipay_qr, test_checkout]
        qr_content:
          type: string
          description: 支付宝二维码内容；前端渲染为二维码，移动端可直接作为“打开支付宝”的链接
        test_checkout_url:
          type: string
          format: uri
          description: 仅测试渠道
        expires_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [id, number, type, status, list_price_minor, remaining_value_minor, discount_minor, credit_applied_minor, amount_due_minor, currency, payment_method, payment, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^ORD-[0-9]{8}-[A-Z0-9]{6}$
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        plan_id:
          type: [string, 'null']
          format: uuid
        plan_name:
          type: [string, 'null']
        price_id:
          type: [string, 'null']
          format: uuid
        addon_price_id:
          type: [string, 'null']
          format: uuid
        list_price_minor:
          type: integer
          format: int64
        remaining_value_minor:
          type: integer
          format: int64
        discount_minor:
          type: integer
          format: int64
        credit_applied_minor:
          type: integer
          format: int64
        amount_due_minor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment:
          oneOf:
          - $ref: '#/components/schemas/PaymentInstruction'
          - type: 'null'
          description: 待支付订单的支付指引；应付为 0 或不再待支付时为 null
        expires_at:
          type: string
          format: date-time
          description: 订单有效期（ORD-04）
        paid_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    Addon:
      type: object
      required: [id, kind, name, expires_at, purchased_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AddonKind'
        name:
          type: string
        bytes_total:
          type: [integer, 'null']
          format: int64
        bytes_used:
          type: [integer, 'null']
          format: int64
        extra_devices:
          type: [integer, 'null']
        expires_at:
          type: [string, 'null']
          format: date-time
        purchased_at:
          type: string
          format: date-time
    Entitlement:
      type: object
      required: [id, plan_id, plan_name, plan_kind, tier, status, starts_at, expires_at, bytes_limit, bytes_used, device_limit, reset_policy, locked_price, addons]
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        plan_kind:
          type: string
          enum: [recurring, one_time, free]
        tier:
          type: integer
        status:
          type: string
          enum: [scheduled, active, over_quota, suspended]
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        cycle_starts_at:
          type: [string, 'null']
          format: date-time
        cycle_ends_at:
          type: [string, 'null']
          format: date-time
        bytes_limit:
          type: integer
          format: int64
          description: 周期额度（快照，BIL-02）；0 表示不限
        bytes_used:
          type: integer
          format: int64
          description: 本周期已用计费字节
        device_limit:
          type: integer
          description: 设备上限（含额外设备名额）
        speed_limit_mbps:
          type: [integer, 'null']
        reset_policy:
          type: string
          enum: [purchase_anchor, calendar_month, never]
        locked_price:
          oneOf:
          - $ref: '#/components/schemas/PlanPrice'
          - type: 'null'
          description: 锁定价格（BIL-07）；免费套餐与兑换开通时可能为 null
        addons:
          type: array
          description: 挂在本权益上、未到期的加购项（BIL-25）
          items:
            $ref: '#/components/schemas/Addon'
    Entitlements:
      type: object
      required: [entitlement_status, is_auto_renew, current, next]
      properties:
        entitlement_status:
          $ref: '#/components/schemas/EntitlementStatus'
        is_auto_renew:
          type: boolean
          readOnly: true
        current:
          oneOf:
          - $ref: '#/components/schemas/Entitlement'
          - type: 'null'
        next:
          oneOf:
          - $ref: '#/components/schemas/Entitlement'
          - type: 'null'
    CreditEntry:
      type: object
      required: [id, amount_minor, currency, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          description: 正数为入账，负数为支出
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          description: |
            原因。已定义的取值：`order_payment`、`order_release`、`quote_adjustment`、`stale_quote`、`late_payment`、
            `refund`、`scheduled_cancelled`、`upgrade_surplus`、`redemption`、`referral`、`admin_adjust`、`account_deletion`。
            客户端对未知取值显示通用文案。
        order_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
    Redemption:
      type: object
      required: [kind, amount_minor, currency, entitlement_id]
      properties:
        kind:
          type: string
          enum: [credit, plan]
        amount_minor:
          type: [integer, 'null']
          format: int64
        currency:
          oneOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
        entitlement_id:
          type: [string, 'null']
          format: uuid
    Announcement:
      type: object
      required: [id, title, body_md, is_pinned, starts_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body_md:
          type: string
        is_pinned:
          type: boolean
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
    ArticleSummary:
      type: object
      required: [slug, title, category, platforms, updated_at]
      properties:
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/ClientPlatform'
        updated_at:
          type: string
          format: date-time
    Article:
      allOf:
      - $ref: '#/components/schemas/ArticleSummary'
      - type: object
        required: [body_md, has_user_variables]
        properties:
          body_md:
            type: string
            description: 已渲染白名单变量的 Markdown（OPS-12）
          has_user_variables:
            type: boolean
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting_user, closed]
    Ticket:
      type: object
      required: [id, number, subject, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^TCK-[0-9]{8}-[A-Z0-9]{6}$
        subject:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TicketDetail:
      allOf:
      - $ref: '#/components/schemas/Ticket'
      - type: object
        required: [messages]
        properties:
          messages:
            type: array
            items:
              $ref: '#/components/schemas/TicketMessage'
    TicketMessage:
      type: object
      required: [id, author, body, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        author:
          type: string
          enum: [user, staff]
        body:
          type: string
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          type: string
          format: date-time
    Attachment:
      type: object
      required: [id, filename, content_type, bytes_size, created_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
          description: 上传时 multipart 分段的文件名（已去除路径与控制字符）；下载时用于 `Content-Disposition`
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          description: 按文件内容识别的类型（OPS-10）
        bytes_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
          description: 文件字节数
        created_at:
          type: string
          format: date-time
    Referrals:
      type: object
      required: [referral_code, invite_url, invited_count, frozen_minor, settled_minor, currency, rule]
      properties:
        referral_code:
          type: string
        invite_url:
          type: string
          format: uri
        invited_count:
          type: integer
        frozen_minor:
          type: integer
          format: int64
          description: 冻结中的返利
        settled_minor:
          type: integer
          format: int64
          description: 已转入余额的返利
        currency:
          $ref: '#/components/schemas/Currency'
        rule:
          type: object
          required: [rate_bps, is_first_order_only]
          properties:
            rate_bps:
              type: integer
              minimum: 0
              maximum: 10000
              description: 返利比例（基点）
            is_first_order_only:
              type: boolean
            cap_minor:
              type: [integer, 'null']
              format: int64
              description: 单人上限
