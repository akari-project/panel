  /v1/quotes:
    post:
      tags: [commerce]
      operationId: createQuote
      summary: 报价
      description: |
        spec/12 ORD-01。`price_id`（套餐价格行）与 `addon_price_id`（加购项价格）二选一；二者只用来确定购买对象，
        金额由服务端按场景确定（spec/11 BIL-21）。场景由报价时的权益状态决定；`mode=downgrade_immediate`
        请求立即降级（BIL-23）。报价 15 分钟有效。
        - 套餐状态不允许购买、立即降级时长不足 1 小时：400 `invalid_request`；
        - 优惠码无效、过期或次数用完：400，`errors[].code` 为 `invalid_code`、`expired`、`exhausted`；
        - 免费账号续费、升降级或购买加购项：409 `entitlement_required`；
        - 存在下一段时续费或再次降级：409 `conflict`（BIL-22）；权益为 `suspended`：409 `invalid_state`。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              plan:
                summary: 套餐
                value:
                  price_id: 0192f0c4-1b00-7000-8000-00000000b001
                  coupon_code: AUTUMN10
                  is_credit_applied: true
              addon:
                summary: 加购项
                value:
                  addon_price_id: 0192f0c4-1c00-7000-8000-00000000c001
                  is_credit_applied: false
      responses:
        '201':
          description: 报价
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                id: 0192f0c4-9a00-7000-8000-000000050001
                order_type: upgrade
                plan_id: 0192f0c4-1a00-7000-8000-00000000a002
                price_id: 0192f0c4-1b00-7000-8000-00000000b003
                addon_price_id: null
                list_price_minor: 8000
                remaining_value_minor: 2500
                discount_minor: 550
                credit_applied_minor: 1000
                credit_refund_minor: 0
                amount_due_minor: 3950
                currency: CNY
                is_locked_price_lost: false
                entitlement_expires_at: '2026-11-01T10:00:00+08:00'
                expires_at: '2026-10-01T10:15:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/QuoteConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
