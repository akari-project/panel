# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: Client API
  version: 0.1.0
  summary: 用户中心与自研客户端共用的接口
  description: |
    面向用户中心（portal）与自研客户端的接口。规格依据为 spec/30，通用约定见 spec/02；本文件是字段级事实来源。

    ## 认证
    - 用户中心使用 Cookie 认证（`cookie`）：`POST /v1/sessions` 以 `platform=web` 登录时，访问令牌与刷新令牌都以
      HttpOnly、Secure、SameSite=Strict 的 Cookie 下发，响应体不含令牌（spec/10 AUTH-08）。
    - 自研客户端使用 Bearer 令牌（`bearer`）：访问令牌为 PASETO v4.public，有效期 15 分钟（AUTH-06）；
      刷新令牌存入系统安全存储，通过 `POST /v1/oauth/token` 轮换（AUTH-07）。
    - 标有 `security: []` 的接口无需认证；同时列出空要求与认证方式的接口（如公告、帮助文档、地区）认证可选，
      认证后返回与本人相关的内容。
    - 需要重新验证的操作（AUTH-23）在 5 分钟内未重新验证时返回 401 `mfa_required`，客户端调用
      `POST /v1/me/reauthentications` 后重试原请求（spec/32 UI-09）。

    ## 错误（CONV-16）
    除 `/v1/oauth/*` 外，错误一律为 RFC 9457 `application/problem+json`，必含 `type`、`title`、`status`、`code`、
    `request_id`；参数错误附 `errors[]`（`{field, code}`）。客户端依据 `code` 显示本地化文案。`/v1/oauth/*` 按
    RFC 6749 §5.2 与 RFC 8628 返回 `application/json` 的 `{error, error_description}`，这是唯一的例外。
    自研客户端版本低于 `/v1/config` 的 `min_version[platform]` 时，任何接口都可能返回 426 `upgrade_required`
    （API-03）；超过限流返回 429 `rate_limited` 并带 `Retry-After`（API-04）。

    ## 分页（CONV-11）
    游标分页：`?limit=50&cursor=...`，`limit` 默认 50、最大 200；响应为 `{items, next_cursor}`，最后一页
    `next_cursor` 为 `null`；非法游标返回 400 `invalid_request`。设备、公告、文章列表不分页，上限见各接口描述。

    ## 幂等（CONV-12）
    产生副作用的 `POST` 接受 `Idempotency-Key`（UUID）。作用域：已认证请求为“账号 + 键”，未认证请求为“路由 + 键”；
    记录保存 24 小时。同键同体返回相同结果；同键不同体返回 422 `idempotency_key_reused`；首个请求仍在处理时返回
    409 `conflict` 并带 `Retry-After`；5xx 不缓存。响应中含令牌、密钥、恢复码或导入链接的接口
    （`POST /v1/sessions`、`/v1/oauth/*`、`POST /v1/device-links`、`POST /v1/me/reauthentications`、
    TOTP 与恢复码、导入链接重置）不接受该请求头，避免在幂等记录中保存秘密。

    ## 缓存（CONV-13）
    `GET /v1/config`、`GET /v1/me/configuration`、`GET /v1/configurations/{token}` 返回强 `ETag`，支持
    `If-None-Match` 与 304。客户端接口中只修改本人设置的操作不要求 `If-Match`（CONV-28）。

    ## 命名（API-01）
    路径、字段、枚举值与错误码中不使用 subscribe、server、node、traffic 四个词；唯一例外是响应头
    `Subscription-Userinfo`。
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://api.example.invalid
  description: 示例地址，部署时替换为站点 API 域名
security:
- bearer: []
- cookie: []
tags:
- name: config
  description: 客户端启动配置、版本与公共资源
- name: auth
  description: 注册、登录、令牌、设备授权与扫码登录
- name: account
  description: 当前账号信息、注销与通知偏好
- name: security
  description: 密码、重新验证、二次验证与 Passkey
- name: devices
  description: 已注册设备与登录会话
- name: connectivity
  description: 地区、连接配置、导入链接、用量与事件流
- name: commerce
  description: 套餐、报价、订单、权益、余额与兑换码
- name: content
  description: 公告与帮助文档（模块可关闭，spec/13 OPS-08）
- name: support
  description: 工单（模块可关闭）
- name: referrals
  description: 邀请返利（模块可关闭）
- name: diagnostics
  description: 诊断日志（模块可关闭，默认关闭）
paths:
  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: 客户端启动配置（已签名）
      description: |
        返回最低版本、公告版本、功能开关与备用域名。`signature` 为 Ed25519 签名，签名对象是 `payload` 按
        RFC 8785（JCS）规范化后的 UTF-8 字节；`key_id` 标识签名密钥，客户端内置当前与下一把公钥（CONV-30）。
      security: []
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedConfig'
              example:
                payload:
                  min_version:
                    ios: 1.2.0
                    android: 1.2.0
                    windows: 1.1.0
                    macos: 1.1.0
                    linux: 1.1.0
                  announcement_version: 17
                  features:
                    announcements: true
                    articles: true
                    support: true
                    referrals: false
                    diagnostics: false
                  api_endpoints:
                  - https://api.example.invalid
                  - https://api-backup.example.invalid
                  issued_at: '2026-10-01T10:00:00+08:00'
                signature: 3q2+7w8Jb1l0m9Kp3yVZ4aQeX2nR6tUoHcFgWjD5sLkP0vN1iE8rT7yB4uA2zC9xM6qS3hG5fJ1dK0wL8oY7eQ==
                key_id: cfg-2026-01
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/releases/latest:
    get:
      tags: [config]
      operationId: getLatestRelease
      summary: 指定平台的最新版本与安装包签名
      security: []
      parameters:
      - name: platform
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ClientPlatform'
        example: android
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
              example:
                platform: android
                version: 1.4.0
                url: https://downloads.example.invalid/client/1.4.0/app-release.apk
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                signature: MEUCIQDx3v8fJb1l0m9Kp3yVZ4aQeX2nR6tUoHcFgWjD5sLkPwIgN1iE8rT7yB4uA2zC9xM6qS3hG5fJ1dK0wL8oY7eQ
                key_id: rel-2026-01
                notes: 修复导入配置后偶发断线的问题。
                is_mandatory: false
                published_at: '2026-09-20T12:00:00+08:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/assets/{digest}:
    get:
      tags: [config]
      operationId: getAsset
      summary: 按内容寻址的公共资源（规则集等）
      description: 内容由 SHA-256 摘要寻址，永不变化，可由 CDN 长期缓存。
      security: []
      parameters:
      - name: digest
        in: path
        required: true
        description: 资源内容的 SHA-256（小写十六进制）
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
        example: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
      responses:
        '200':
          description: 资源内容
          headers:
            Cache-Control:
              description: '`public, max-age=31536000, immutable`'
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
              example: SRS1...binary...
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/plans:
    get:
      tags: [commerce]
      operationId: listPlans
      summary: 在售套餐、价格与加购项价格
      description: |
        只返回 `on_sale` 的套餐与在售价格行，以及在售的加购项价格（spec/11 BIL-21、BIL-24）。
        列表不分页：在售套餐与加购项由运营者维护，数量上限为 200（超出时服务端只返回按排序的前 200 项）。
        已购用户的续费价格以 `GET /v1/me/entitlements` 的 `locked_price` 与报价结果为准。
      security:
      - {}
      - bearer: []
      - cookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, addon_prices]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/Plan'
                  addon_prices:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/AddonPrice'
              example:
                items:
                - id: 0192f0c4-1a00-7000-8000-00000000a001
                  name: 标准版
                  description: 适合日常使用，每月 200 GiB。
                  kind: recurring
                  tier: 1
                  bytes_per_cycle: 214748364800
                  device_limit: 3
                  speed_limit_mbps: null
                  reset_policy: purchase_anchor
                  location_count: 12
                  prices:
                  - id: 0192f0c4-1b00-7000-8000-00000000b001
                    period: month
                    period_days: null
                    amount_minor: 3000
                    currency: CNY
                  - id: 0192f0c4-1b00-7000-8000-00000000b002
                    period: year
                    period_days: null
                    amount_minor: 30000
                    currency: CNY
                addon_prices:
                - id: 0192f0c4-1c00-7000-8000-00000000c001
                  kind: data
                  name: 50 GiB 流量包
                  bytes_total: 53687091200
                  extra_devices: null
                  amount_minor: 1000
                  currency: CNY
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/locations:
    get:
      tags: [connectivity]
      operationId: listLocations
      summary: 可用地区、负载提示与倍率
      description: |
        未认证时返回全部公开地区；认证后 `is_accessible` 表示当前权益能否使用该地区。列表不分页，
        数量上限为 500（面向用户的地区由运营者维护）。
      security:
      - {}
      - bearer: []
      - cookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/Location'
              example:
                items:
                - id: 0192f0c4-2a00-7000-8000-00000000d001
                  name: 东京 01
                  region_code: JP
                  city: Tokyo
                  load_percent: 42
                  is_available: true
                  is_accessible: true
                  usage_multiplier: '1.00'
                - id: 0192f0c4-2a00-7000-8000-00000000d002
                  name: 洛杉矶 01
                  region_code: US
                  city: Los Angeles
                  load_percent: 18
                  is_available: true
                  is_accessible: false
                  usage_multiplier: '1.50'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts:
    post:
      tags: [auth]
      operationId: createAccount
      summary: 注册
      description: |
        spec/10 AUTH-01、AUTH-02。邮箱已注册时同样返回 202，不创建账号，改为向该邮箱发送提醒。
        注册成功后不登录，用户完成邮箱验证或直接调用 `POST /v1/sessions` 登录（未验证邮箱不能下单，AUTH-03）。
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                invite_code:
                  type: string
                  maxLength: 64
                  description: 账号邀请码或管理员生成的注册码；注册策略为“仅邀请码”时必填
                locale:
                  type: string
                  description: BCP 47 语言标签
                timezone:
                  type: string
                  description: IANA 时区名
                captcha_token:
                  type: string
                  description: 人机验证令牌（预留，AUTH-02）
            example:
              email: alice@example.com
              password: correct-horse-battery
              invite_code: K7Q2XM
              locale: zh-CN
              timezone: Asia/Shanghai
      responses:
        '202':
          description: 已受理，验证邮件已发送（无论邮箱是否已注册）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/RegistrationClosed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/verification:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: 提交邮箱验证码
      description: |
        AUTH-03：6 位数字，15 分钟有效，最多尝试 5 次。已登录时只需 `code`；未登录时必须同时提交 `email`。
      security:
      - {}
      - bearer: []
      - cookie: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                email:
                  type: string
                  format: email
                  description: 未登录时必填
                code:
                  type: string
                  pattern: ^[0-9]{6}$
            example:
              email: alice@example.com
              code: '482913'
      responses:
        '204':
          description: 已验证
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/verification/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: 重新发送邮箱验证码
      description: |
        AUTH-03：每个账号每分钟 1 次、每天 10 次；发送新码后旧码作废。未登录时提交 `email`，
        无论邮箱是否存在都返回 202。
      security:
      - {}
      - bearer: []
      - cookie: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 未登录时必填
                captcha_token:
                  type: string
            example:
              email: alice@example.com
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/password-resets:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 发起找回密码
      description: AUTH-04：发送 30 分钟有效的一次性链接；无论邮箱是否存在都返回 202。限流见 API-04。
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                captcha_token:
                  type: string
            example:
              email: alice@example.com
      responses:
        '202':
          description: 已受理（无论邮箱是否存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/password-resets/confirmation:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: 确认找回密码并设置新密码
      description: |
        AUTH-04：`token` 取自邮件链接的 URL 片段 `#token=`。成功后吊销该账号的全部会话。
        令牌无效返回 400，`errors[].code` 为 `invalid_code`；过期为 `expired`。
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  description: 32 字节随机值的 base64url
                  pattern: ^[A-Za-z0-9_-]{43}$
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
            example:
              token: q3v8fJb1l0m9Kp3yVZ4aQeX2nR6tUoHcFgWjD5sLkP0
              new_password: new-correct-horse-battery
      responses:
        '204':
          description: 密码已重置
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: 登录并注册设备
      description: |
        两步登录（AUTH-20）：
        1. 提交 `email`、`password`、`device`。账号已启用二次验证时返回 401 `mfa_required`，problem 附
           `challenge_id`（5 分钟有效）与 `methods`。
        2. 再次调用本接口，提交 `challenge_id`、`device`，以及 `totp_code`、`webauthn_assertion`、`recovery_code`
           三者之一，不再提交密码。每个 challenge 最多尝试 5 次。

        `device.platform=web` 时只注册 web 设备，不生成代理凭据，令牌以 Cookie 下发，响应体不含令牌（AUTH-08、AUTH-10）。
        其他平台可以带上已有的 `device_id` 与 `device_proof` 复用原设备记录。设备数已达上限时登录照常成功，
        `credential_status` 为 `device_limit_reached`（AUTH-14）。限流与冷却见 AUTH-09。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PasswordLogin'
              - $ref: '#/components/schemas/MfaLoginTotp'
              - $ref: '#/components/schemas/MfaLoginPasskey'
              - $ref: '#/components/schemas/MfaLoginRecoveryCode'
            examples:
              password:
                summary: 第一步：邮箱与密码
                value:
                  email: alice@example.com
                  password: correct-horse-battery
                  device:
                    platform: ios
                    model: iPhone17,1
                    app_version: 1.4.0
                    public_key: MCowBQYDK2VwAyEAGb9ECWmEzf6FQbrBZ9w7lshQhqowtrbLDFw4rXAxZuE=
              totp:
                summary: 第二步：TOTP
                value:
                  challenge_id: 0192f0c4-3a00-7000-8000-00000000e001
                  totp_code: '731946'
                  device:
                    platform: ios
                    model: iPhone17,1
                    app_version: 1.4.0
                    public_key: MCowBQYDK2VwAyEAGb9ECWmEzf6FQbrBZ9w7lshQhqowtrbLDFw4rXAxZuE=
      responses:
        '201':
          description: 已登录。`platform=web` 时令牌通过 `Set-Cookie` 下发。
          headers:
            Set-Cookie:
              description: 仅 `platform=web`：HttpOnly、Secure、SameSite=Strict 的访问令牌与刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                app:
                  summary: 自研客户端
                  value:
                    device_id: 0192f0c4-4a00-7000-8000-00000000f001
                    token_type: Bearer
                    access_token: v4.public.eyJzdWIiOiIwMTkyZjBjNCIsInNpZCI6IjAxOTJmMGM0In0.c2lnbmF0dXJl
                    refresh_token: rt_Zk3q9v8fJb1l0m9Kp3yVZ4aQeX2nR6tUoHcFgWjD5sL
                    expires_in: 900
                    credential_status: issued
                web:
                  summary: 用户中心
                  value:
                    device_id: 0192f0c4-4a00-7000-8000-00000000f002
                    token_type: Bearer
                    expires_in: 900
                    credential_status: web_device
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/AccountSuspended'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/nonces:
    post:
      tags: [auth]
      operationId: createSessionNonce
      summary: 取得设备证明用的 nonce
      description: |
        AUTH-10：带已有 `device_id` 重新登录前调用。客户端用该设备的 Ed25519 私钥对返回的 `nonce` 签名，
        放入 `POST /v1/sessions` 的 `device.device_proof`。nonce 有效 60 秒，只能使用一次。
        响应含一次性值，不接受 `Idempotency-Key`。
      security: []
      responses:
        '201':
          description: 新的 nonce
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expires_at]
                properties:
                  nonce:
                    type: string
                    description: 32 字节随机值的 base64url
                    pattern: ^[A-Za-z0-9_-]{43}$
                  expires_at:
                    type: string
                    format: date-time
              example:
                nonce: Tq7Lm2Xc9Vb4Nz1Kd8Rf5Hs0Jw3Pg6Ya2Ue9Io4Qx7B
                expires_at: '2026-10-01T10:01:00+08:00'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/current:
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      summary: 登出，并吊销本设备及其代理凭据
      description: AUTH-10：吊销本会话与本设备，释放设备名额；web 设备同时清除 Cookie。
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/oauth/token:
    post:
      tags: [auth]
      operationId: issueToken
      summary: 刷新令牌轮换；设备授权与扫码登录的轮询
      description: |
        RFC 6749 / RFC 8628。错误为 `application/json` 的 `{error, error_description}`（CONV-16 例外）。
        - `grant_type=refresh_token`：刷新令牌轮换（AUTH-07）。浏览器中省略 `refresh_token`，由 Cookie 携带，新令牌同样以 Cookie 下发。
        - `grant_type=urn:ietf:params:oauth:grant-type:device_code`：设备授权时 `device_code` 取自
          `POST /v1/oauth/device_authorization`；扫码登录时把 `POST /v1/device-links` 返回的 `poll_token` 作为
          `device_code` 提交（AUTH-24）。批准前返回 `authorization_pending`，轮询过快返回 `slow_down`。
          签发的令牌受众只能是 `client`，设备计入设备上限。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:device_code
                refresh_token:
                  type: string
                  description: '`grant_type=refresh_token` 时必填（浏览器由 Cookie 携带）'
                device_code:
                  type: string
                  description: 设备授权的 `device_code`，或扫码登录的 `poll_token`
                client_id:
                  type: string
                  description: 公开客户端标识，例如 `app`、`tv`
            example:
              grant_type: urn:ietf:params:oauth:grant-type:device_code
              device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
              client_id: tv
      responses:
        '200':
          description: 新令牌对
          headers:
            Cache-Control:
              description: '`no-store`（RFC 6749 §5.1）'
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: v4.public.eyJzdWIiOiIwMTkyZjBjNCIsInNpZCI6IjAxOTJmMGM1In0.c2lnbmF0dXJl
                refresh_token: rt_Bx7Jc2Kq9m3Lr5Ns8Pt1Qv4Rw6Sx0Ty2Uz5Va8Wb3Xc
                token_type: Bearer
                expires_in: 900
                device_id: 0192f0c4-4a00-7000-8000-00000000f003
        '400':
          $ref: '#/components/responses/OAuthError'
        default:
          $ref: '#/components/responses/OAuthError'
  /v1/oauth/device_authorization:
    post:
      tags: [auth]
      operationId: startDeviceAuthorization
      summary: 电视、路由器等设备取得设备授权码
      description: |
        RFC 8628 §3.1–3.2。用户在用户中心 `/activate` 页面输入 `user_code` 批准（`POST /v1/me/device-authorizations`），
        设备以 `device_code` 轮询 `POST /v1/oauth/token`。错误格式同 `/v1/oauth/token`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device_platform]
              properties:
                client_id:
                  type: string
                device_platform:
                  $ref: '#/components/schemas/ClientPlatform'
                device_model:
                  type: string
                  maxLength: 100
                app_version:
                  type: string
                  maxLength: 32
                public_key:
                  type: string
                  description: Ed25519 公钥（SPKI DER 的 base64）
            example:
              client_id: tv
              device_platform: android
              device_model: Chromecast with Google TV
              app_version: 1.4.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                    format: uri
                  verification_uri_complete:
                    type: string
                    format: uri
                  expires_in:
                    type: integer
                  interval:
                    type: integer
              example:
                device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
                user_code: WDJB-MJHT
                verification_uri: https://portal.example.invalid/activate
                verification_uri_complete: https://portal.example.invalid/activate?user_code=WDJB-MJHT
                expires_in: 900
                interval: 5
        '400':
          $ref: '#/components/responses/OAuthError'
        default:
          $ref: '#/components/responses/OAuthError'
  /v1/me/device-authorizations:
    post:
      tags: [auth]
      operationId: approveDeviceAuthorization
      summary: 用户中心提交 user_code 批准设备授权
      description: AUTH-24。`user_code` 无效返回 400 `invalid_code`，过期返回 `expired`。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  maxLength: 16
            example:
              user_code: WDJB-MJHT
      responses:
        '200':
          description: 已批准；返回被批准的设备
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    $ref: '#/components/schemas/RequestingDevice'
              example:
                device:
                  platform: android
                  model: Chromecast with Google TV
                  app_version: 1.4.0
                  ip_prefix: 203.0.113.0/24
                  region: 中国 上海
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/device-links:
    post:
      tags: [auth]
      operationId: createDeviceLink
      summary: 新设备发起扫码登录
      description: |
        AUTH-24。新设备显示 `qr_content` 生成的二维码与 `check_digits`（2 位校验数字），并以 `poll_token`
        作为 `device_code` 轮询 `POST /v1/oauth/token`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  $ref: '#/components/schemas/DeviceInfo'
            example:
              device:
                platform: macos
                model: MacBookAir10,1
                app_version: 1.4.0
                public_key: MCowBQYDK2VwAyEAe7rUf1aK4dQm0vZ3jH9sN2pL6cX8bW5tY1gR4kF0oE8=
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLinkCreated'
              example:
                id: 0192f0c4-5a00-7000-8000-000000010001
                qr_content: https://portal.example.invalid/link/0192f0c4-5a00-7000-8000-000000010001
                poll_token: dl_Hq8Zp3Lw6Nc1Vt9Ks4Rb7Jm2Xf5Yd0Ga3Ue6Io9Po2Q
                check_digits: '47'
                expires_in: 300
                interval: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/device-links/{id}:
    get:
      tags: [auth]
      operationId: getDeviceLink
      summary: 批准方查看扫码登录请求
      description: |
        返回请求设备的平台、型号、IP 前缀与所在地区，以及 `candidate_digits`（3 个 2 位数字，其中一个与新设备
        屏幕上的 `check_digits` 相同），用户需选出相同的数字后批准（AUTH-24）。
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLink'
              example:
                id: 0192f0c4-5a00-7000-8000-000000010001
                status: pending
                device:
                  platform: macos
                  model: MacBookAir10,1
                  app_version: 1.4.0
                  ip_prefix: 198.51.100.0/24
                  region: 中国 杭州
                candidate_digits: ['12', '47', '85']
                expires_at: '2026-10-01T10:05:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/device-links/{id}/approve:
    post:
      tags: [auth]
      operationId: approveDeviceLink
      summary: 带校验数字批准扫码登录
      description: |
        `check_digits` 与新设备不一致时返回 400（`errors[].code` 为 `invalid_code`），多次失败后请求作废
        （`exhausted`）。非 web 批准方用本设备私钥对 `id` 与 `check_digits` 签名（AUTH-10）。
        请求已批准、已过期时返回 409 `invalid_state`。
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check_digits]
              properties:
                check_digits:
                  type: string
                  pattern: ^[0-9]{2}$
                device_signature:
                  type: string
                  description: 非 web 批准方必填：Ed25519 对 `{id}.{check_digits}` 的签名（base64）
            example:
              check_digits: '47'
              device_signature: 4n5pZ0l3q2Vx8Kj7Rb1Tc6Ud9We2Yf5Ag8Bh1Ci4Dj7Ek0Fl3Gm6Hn9Io2Jp5Kq8Lr1Ms4Nt7Ou0Pv3Qw6Rx9Sy2Tz5A==
      responses:
        '204':
          description: 已批准
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        default:
          $ref: '#/components/responses/Problem'
  /v1/deletion-cancellations:
    post:
      tags: [auth]
      operationId: cancelAccountDeletion
      summary: 用邮件中的令牌撤销注销
      description: |
        AUTH-05：注销后 30 天内有效。恢复后需要重新登录，代理凭据重新生成；已结束的权益与作废的余额不恢复。
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
            example:
              token: Vx8Kj7Rb1Tc6Ud9We2Yf5Ag8Bh1Ci4Dj7Ek0Fl3Gm6H
      responses:
        '204':
          description: 注销已撤销
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: 当前账号信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 0192f0c4-0a00-7000-8000-000000000001
                email: alice@example.com
                is_email_verified: true
                status: active
                locale: zh-CN
                timezone: Asia/Shanghai
                is_auto_renew: false
                is_mfa_enabled: true
                mfa_methods: [totp, recovery_code]
                entitlement_status: active
                device_limit: 3
                referral_code: K7Q2XM
                created_at: '2026-09-01T09:12:00+08:00'
                deletion_scheduled_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [account]
      operationId: updateMe
      summary: 修改语言、时区与自动续费开关
      description: |
        只修改本人设置，不要求 `If-Match`（CONV-28）。`is_auto_renew` 是账号级开关，权益变更后保留（spec/11 BIL-19）。
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              minProperties: 1
              properties:
                locale:
                  type: string
                  description: BCP 47 语言标签
                timezone:
                  type: string
                  description: IANA 时区名
                is_auto_renew:
                  type: boolean
            example:
              is_auto_renew: true
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 0192f0c4-0a00-7000-8000-000000000001
                email: alice@example.com
                is_email_verified: true
                status: active
                locale: zh-CN
                timezone: Asia/Shanghai
                is_auto_renew: true
                is_mfa_enabled: true
                mfa_methods: [totp, recovery_code]
                entitlement_status: active
                device_limit: 3
                referral_code: K7Q2XM
                created_at: '2026-09-01T09:12:00+08:00'
                deletion_scheduled_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [account]
      operationId: deleteMe
      summary: 注销账号
      description: |
        AUTH-05。需要 5 分钟内完成过重新验证，否则返回 401 `mfa_required`。持有管理员角色、存在 `pending`
        订单或已支付未开通订单时返回 409 `invalid_state`。受理后立即吊销全部会话与代理凭据，生效中的权益立即结束、
        不退款，余额作废；30 天内可凭邮件中的令牌撤销（`POST /v1/deletion-cancellations`）。
      responses:
        '202':
          description: 注销已受理
          content:
            application/json:
              schema:
                type: object
                required: [status, purge_at]
                properties:
                  status:
                    type: string
                    const: deleting
                  purge_at:
                    type: string
                    format: date-time
                    description: 删除个人数据的时间
              example:
                status: deleting
                purge_at: '2026-10-31T10:00:00+08:00'
        '401':
          $ref: '#/components/responses/MfaRequired'
        '409':
          $ref: '#/components/responses/InvalidState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/reauthentications:
    post:
      tags: [security]
      operationId: reauthenticate
      summary: 重新验证（step-up）
      description: |
        AUTH-23：提交密码，或 `totp_code`、`webauthn_assertion`、`recovery_code` 之一；成功后 5 分钟内可以执行
        需要重新验证的操作。可附上 401 `mfa_required` 返回的 `challenge_id`。密码总是可用，不列入 `methods`。
        密码或验证码不正确时返回 400，`errors[].code` 为 `incorrect`，并计入 AUTH-09 的失败次数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reauthentication'
            examples:
              password:
                value:
                  password: correct-horse-battery
              totp:
                value:
                  challenge_id: 0192f0c4-3a00-7000-8000-00000000e002
                  totp_code: '105277'
      responses:
        '200':
          description: 已重新验证
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at:
                    type: string
                    format: date-time
                    description: 重新验证的有效期截止时间
              example:
                expires_at: '2026-10-01T10:05:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/password:
    put:
      tags: [security]
      operationId: changePassword
      summary: 修改密码
      description: 需要重新验证（AUTH-23）。成功后吊销除当前会话外的全部会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
            example:
              new_password: new-correct-horse-battery
      responses:
        '204':
          description: 已修改
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MfaRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/totp:
    post:
      tags: [security]
      operationId: startTotpEnrollment
      summary: 开始绑定 TOTP
      description: 返回待确认的密钥；调用 `POST /v1/me/mfa/totp/activation` 提交一次验证码后才生效。已启用时返回 409 `invalid_state`。
      responses:
        '201':
          description: 待确认的 TOTP 密钥
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri, expires_at]
                properties:
                  secret:
                    type: string
                    description: Base32 密钥
                  otpauth_uri:
                    type: string
                    description: '`otpauth://` URI，供生成二维码'
                  expires_at:
                    type: string
                    format: date-time
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauth_uri: otpauth://totp/Example:alice%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Example
                expires_at: '2026-10-01T10:15:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [security]
      operationId: disableTotp
      summary: 停用 TOTP
      description: 需要重新验证（AUTH-23）。持有管理员角色的账号不能停用（AUTH-12），返回 409 `invalid_state`。
      responses:
        '204':
          description: 已停用，恢复码同时作废
        '401':
          $ref: '#/components/responses/MfaRequired'
        '409':
          $ref: '#/components/responses/InvalidState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/totp/activation:
    post:
      tags: [security]
      operationId: activateTotp
      summary: 确认绑定 TOTP 并取得恢复码
      description: AUTH-11：生效时生成 10 个一次性恢复码，明文只在此响应中出现一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  pattern: ^[0-9]{6}$
            example:
              totp_code: '731946'
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
              example:
                recovery_codes: [7KQ2-XM4P, 9RTB-3VNL, H6WD-2CJE, M8FA-5YQS, P3ZG-7KXR, T2NV-8LHD, W5JC-4PEB, X9QM-6RFT, Y4HK-1SGA, Z7LE-3UWN]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/InvalidState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/recovery-codes:
    post:
      tags: [security]
      operationId: regenerateRecoveryCodes
      summary: 重新生成恢复码
      description: 需要重新验证（AUTH-23）。旧恢复码立即作废。未启用 TOTP 时返回 409 `invalid_state`。
      responses:
        '200':
          description: 新的恢复码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
              example:
                recovery_codes: [2HQD-8KXM, 4JRV-7LPN, 5MWT-3CQB, 6NYE-9DRF, 7PZF-1EGS, 8QAG-2FHT, 9RBH-4GJU, AB3K-5HKV, CD4L-6JLW, EF5M-7KMX]
        '401':
          $ref: '#/components/responses/MfaRequired'
        '409':
          $ref: '#/components/responses/InvalidState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys/options:
    post:
      tags: [security]
      operationId: createPasskeyOptions
      summary: 取得 Passkey 注册选项（M4）
      description: 返回 WebAuthn `PublicKeyCredentialCreationOptions` 的 JSON 形式（WebAuthn Level 3 `toJSON`），5 分钟有效。
      responses:
        '200':
          description: 注册选项
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key:
                    type: object
                    additionalProperties: true
                    description: PublicKeyCredentialCreationOptionsJSON
              example:
                public_key:
                  challenge: Y2hhbGxlbmdlLTAxOTJmMGM0
                  rp:
                    id: portal.example.invalid
                    name: Example
                  user:
                    id: MDE5MmYwYzQtMGEwMA
                    name: alice@example.com
                    displayName: alice@example.com
                  pubKeyCredParams:
                  - type: public-key
                    alg: -7
                  timeout: 300000
                  attestation: none
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys:
    get:
      tags: [security]
      operationId: listPasskeys
      summary: Passkey 列表（M4）
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Passkey'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
              example:
                items:
                - id: 0192f0c4-6a00-7000-8000-000000020001
                  name: iPhone
                  created_at: '2026-09-10T20:00:00+08:00'
                  last_used_at: '2026-09-30T08:31:00+08:00'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [security]
      operationId: registerPasskey
      summary: 注册 Passkey（M4）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                name:
                  type: string
                  maxLength: 64
                credential:
                  type: object
                  additionalProperties: true
                  description: RegistrationResponseJSON（WebAuthn Level 3）
            example:
              name: iPhone
              credential:
                id: AbCdEf0123456789
                rawId: AbCdEf0123456789
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
                  attestationObject: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YQ
      responses:
        '201':
          description: 已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: 0192f0c4-6a00-7000-8000-000000020001
                name: iPhone
                created_at: '2026-10-01T10:00:00+08:00'
                last_used_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys/{id}:
    delete:
      tags: [security]
      operationId: deletePasskey
      summary: 删除 Passkey（M4）
      description: 需要重新验证（AUTH-23）。
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/MfaRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备与登录会话列表
      description: |
        只返回未吊销的设备，包括 web 设备（浏览器登录），不分页（CONV-11）。非 web 设备数量受设备上限约束；
        web 设备不计入上限，服务端对每个账号未吊销的 web 设备最多保留 50 条（超出时吊销最久未活跃的一条），
        因此列表总数不超过“设备上限 + 50”。`has_credential` 为假表示因设备上限未下发代理凭据（AUTH-14）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, device_limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  device_limit:
                    type: integer
                    description: 当前设备上限（含额外设备名额）
              example:
                device_limit: 3
                items:
                - id: 0192f0c4-4a00-7000-8000-00000000f001
                  platform: ios
                  model: iPhone17,1
                  app_version: 1.4.0
                  created_at: '2026-09-01T09:20:00+08:00'
                  last_seen_at: '2026-10-01T09:58:00+08:00'
                  ip_prefix: 203.0.113.0/24
                  is_current: false
                  has_credential: true
                - id: 0192f0c4-4a00-7000-8000-00000000f002
                  platform: web
                  model: Firefox 131 on Windows
                  app_version: null
                  created_at: '2026-10-01T09:00:00+08:00'
                  last_seen_at: '2026-10-01T10:00:00+08:00'
                  ip_prefix: 198.51.100.0/24
                  is_current: true
                  has_credential: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/devices/{id}:
    delete:
      tags: [devices]
      operationId: removeDevice
      summary: 移除设备
      description: AUTH-15：吊销该设备的会话与代理凭据；因设备上限未获得凭据的其他设备随后自动获得凭据（AUTH-14）。
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 已移除
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/notification-preferences:
    get:
      tags: [account]
      operationId: getNotificationPreferences
      summary: 通知偏好
      description: OPS-04、OPS-05。安全类与交易类不可关闭，`is_locked` 为真。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
              example:
                items:
                - {category: security, channel: email, is_enabled: true, is_locked: true}
                - {category: transaction, channel: email, is_enabled: true, is_locked: true}
                - {category: reminder, channel: email, is_enabled: true, is_locked: false}
                - {category: marketing, channel: email, is_enabled: false, is_locked: false}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [account]
      operationId: replaceNotificationPreferences
      summary: 修改通知偏好
      description: 整体替换可修改的项。把安全类或交易类设为关闭返回 400，`errors[].code` 为 `not_allowed`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [category, channel, is_enabled]
                    properties:
                      category:
                        $ref: '#/components/schemas/NotificationCategory'
                      channel:
                        $ref: '#/components/schemas/NotificationChannel'
                      is_enabled:
                        type: boolean
            example:
              items:
              - {category: reminder, channel: email, is_enabled: true}
              - {category: marketing, channel: email, is_enabled: false}
      responses:
        '200':
          description: 修改后的偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
              example:
                items:
                - {category: security, channel: email, is_enabled: true, is_locked: true}
                - {category: transaction, channel: email, is_enabled: true, is_locked: true}
                - {category: reminder, channel: email, is_enabled: true, is_locked: false}
                - {category: marketing, channel: email, is_enabled: false, is_locked: false}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/configuration:
    get:
      tags: [connectivity]
      operationId: getMyConfiguration
      summary: 本设备的结构化连接配置
      description: |
        返回本设备的代理凭据、可连接的入站与规则集资源，带强 ETag（CONV-13）。未下发凭据时 `credential` 为 null，
        `credential_status` 说明原因：`device_limit_reached`（AUTH-14）、`entitlement_inactive`（免费账号，或权益为
        `over_quota`、`suspended`，spec/11 ACS-01）、`web_device`（web 设备不生成凭据）。客户端缓存最后一次结果（API-06）。
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
              examples:
                issued:
                  summary: 已下发凭据
                  value:
                    version: 1842
                    credential_status: issued
                    entitlement_status: active
                    credential:
                      id: 0192f0c4-7a00-7000-8000-000000030001
                      secret: 5f1c0b7e-3d2a-4c8b-9e6f-1a2b3c4d5e6f
                    endpoints:
                    - location_id: 0192f0c4-2a00-7000-8000-00000000d001
                      protocol: vless
                      kernel: singbox
                      host: jp1.example.invalid
                      port: 443
                      transport:
                        type: tcp
                      tls:
                        type: reality
                        sni: www.example.com
                        public_key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0
                        short_id: 6ba85179e30d4fc2
                      flow: xtls-rprx-vision
                    - location_id: 0192f0c4-2a00-7000-8000-00000000d001
                      protocol: hysteria2
                      kernel: singbox
                      host: jp1.example.invalid
                      port: 8443
                      transport:
                        type: quic
                      tls:
                        type: tls
                        sni: jp1.example.invalid
                    rule_assets:
                    - name: geosite-cn
                      digest: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                limit:
                  summary: 设备数已达上限，未下发凭据
                  value:
                    version: 1842
                    credential_status: device_limit_reached
                    entitlement_status: active
                    credential: null
                    endpoints: []
                    rule_assets: []
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/export-link:
    get:
      tags: [connectivity]
      operationId: getExportLink
      summary: 第三方客户端导入链接
      description: AUTH-16：用户中心随时可以读取，界面默认遮挡。
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: '`private, no-store`'
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLink'
              example:
                url: https://api.example.invalid/v1/configurations/Zk3q9v8fJb1l0m9Kp3yVZ4aQeX2nR6tU
                created_at: '2026-09-01T09:12:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/export-link/rotation:
    post:
      tags: [connectivity]
      operationId: rotateExportLink
      summary: 重置导入链接
      description: |
        AUTH-16：需要重新验证（AUTH-23）。在同一事务中生成新令牌并轮换共用凭据；旧链接立即失效。
      responses:
        '200':
          description: 新的导入链接
          headers:
            Cache-Control:
              description: '`private, no-store`'
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLink'
              example:
                url: https://api.example.invalid/v1/configurations/Hq8Zp3Lw6Nc1Vt9Ks4Rb7Jm2Xf5Yd0Ga
                created_at: '2026-10-01T10:00:00+08:00'
        '401':
          $ref: '#/components/responses/MfaRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/usage:
    get:
      tags: [connectivity]
      operationId: getUsage
      summary: 当前周期用量、每日用量与按地区分布
      description: |
        `cycle` 为当前流量周期（spec/11 BIL-16）；`daily` 覆盖最近 `days` 天（按用户时区分日）；`by_location` 为当前
        周期内按地区的分布。`bytes_billed` 为乘以倍率后的计费字节。免费账号 `cycle` 为 null。
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
        example: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
              example:
                cycle:
                  starts_at: '2026-09-15T00:00:00+08:00'
                  ends_at: '2026-10-15T00:00:00+08:00'
                  bytes_used: 96636764160
                  bytes_limit: 214748364800
                  bytes_addon_remaining: 53687091200
                daily:
                - date: '2026-09-30'
                  bytes_up: 314572800
                  bytes_down: 4294967296
                  bytes_billed: 4609540096
                - date: '2026-10-01'
                  bytes_up: 209715200
                  bytes_down: 3221225472
                  bytes_billed: 3430940672
                by_location:
                - location_id: 0192f0c4-2a00-7000-8000-00000000d001
                  location_name: 东京 01
                  bytes_up: 1073741824
                  bytes_down: 64424509440
                  bytes_billed: 65498251264
                - location_id: 0192f0c4-2a00-7000-8000-00000000d002
                  location_name: 洛杉矶 01
                  bytes_up: 536870912
                  bytes_down: 20937965568
                  bytes_billed: 32212254720
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/events:
    get:
      tags: [connectivity]
      operationId: streamEvents
      summary: 事件流（SSE）
      description: |
        每条事件的 `event` 字段取值见 `EventType`，`data` 为 JSON。会话被吊销或令牌过期时发送 `session_revoked`
        后关闭连接（AUTH-06）。支持 `Last-Event-ID` 续传。
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧；每条事件的 `event` 行取值见 `EventMessage.event`
                contentSchema:
                  $ref: '#/components/schemas/EventMessage'
              example: |+
                id: 0192f0c4-8a00-7000-8000-000000040001
                event: quota_warning
                data: {"percent":80,"bytes_used":171798691840,"bytes_limit":214748364800}

                id: 0192f0c4-8a00-7000-8000-000000040002
                event: profile_updated
                data: {"version":1843}

        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /v1/configurations/{token}:
    get:
      tags: [connectivity]
      operationId: exportConfiguration
      summary: 第三方客户端配置导出
      description: |
        spec/23。令牌只按 SHA-256 查找，无效令牌返回 404（EXP-01）。格式由 `format` 决定，省略时等同于 `auto`，
        按 User-Agent 识别（EXP-02）；浏览器（User-Agent 以 `Mozilla/` 开头且 `Accept` 含 `text/html`）返回 302
        到用户中心的导入页。强 ETag，支持 `If-None-Match` 与 304（EXP-04）。免费账号、权益为 `over_quota` 或
        `suspended`、账号状态不是 `active` 时返回不含入站的配置（EXP-06）。限流：每个令牌每分钟 30 次，每个 IP
        每分钟 60 次（EXP-01）。
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: 导出令牌
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
        example: Zk3q9v8fJb1l0m9Kp3yVZ4aQeX2nR6tU
      - name: format
        in: query
        schema:
          type: string
          enum: [auto, singbox, mihomo, base64]
          default: auto
        example: auto
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 目标客户端格式的配置
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Subscription-Userinfo:
              $ref: '#/components/headers/UsageUserinfoHeader'
            Profile-Update-Interval:
              $ref: '#/components/headers/ProfileUpdateInterval'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: sing-box 配置（`format=singbox`）
              example:
                log:
                  level: warn
                outbounds:
                - type: direct
                  tag: direct
                route:
                  final: direct
            application/yaml:
              schema:
                type: string
                description: mihomo 配置（`format=mihomo`）
              example: |
                mixed-port: 7890
                mode: rule
                proxies: []
                rules:
                  - MATCH,DIRECT
            text/plain:
              schema:
                type: string
                description: base64 编码的分享链接列表（`format=base64`）
              example: dmxlc3M6Ly81ZjFjMGI3ZS0zZDJhLTRjOGItOWU2Zi0xYTJiM2M0ZDVlNmZAanAxLmV4YW1wbGUuaW52YWxpZDo0NDMjJUU0JUI4JTlDJUU0JUJBJUFDMDE=
        '302':
          description: 浏览器访问，重定向到用户中心的导入页
          headers:
            Location:
              description: 用户中心导入页地址
              schema:
                type: string
                format: uri
              example: https://portal.example.invalid/import
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
        '304':
          description: 未修改；同样携带实时的 `Subscription-Userinfo`（EXP-05）
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Subscription-Userinfo:
              $ref: '#/components/headers/UsageUserinfoHeader'
            Profile-Update-Interval:
              $ref: '#/components/headers/ProfileUpdateInterval'
            Cache-Control:
