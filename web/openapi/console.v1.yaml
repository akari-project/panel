          description: '操作原因，写入审计日志（spec/10 AUTH-18）'
    AccountUpdate:
      type: object
      properties:
        locale:
          type: string
        timezone:
          type:
          - string
          - 'null'
        is_auto_renew:
          type: boolean
        is_email_verified:
          type: boolean
      minProperties: 1
    ReasonBody:
      type: object
      required:
      - reason
