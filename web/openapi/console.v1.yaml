components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: __Host-console_access_token
      description: '受众为 `console` 的 PASETO v4.public 访问令牌（AUTH-21），由 `POST /v1/sessions` 以 HttpOnly、Secure、SameSite=Strict Cookie 下发；刷新令牌 Cookie `__Host-console_refresh_token` 只用于 `POST /v1/oauth/token`（AUTH-08）'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: '不透明的 base64url 游标（CONV-11）'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '幂等键（CONV-12）：相同键与请求体返回相同结果；不同请求体返回 422 `idempotency_key_reused`；首个请求仍在处理时返回 409 `conflict`。'
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '必须携带：资源当前的强 ETag。缺少返回 428 `precondition_required`，不一致返回 409 `conflict`（CONV-28）。'
      schema:
        type: string
      example: '"p-4f1c9a2e"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '与当前 ETag 相同时返回 304（CONV-13）'
      schema:
        type: string
    MfaAssertion:
      name: Mfa-Assertion
      in: header
      required: false
      description: '敏感操作必须携带：5 分钟内由 `POST /v1/staff/me/step-up` 取得的短期令牌（AUTH-19）。缺少或过期返回 401 `mfa_required`。'
      schema:
        type: string
    AuditReason:
      name: Audit-Reason
      in: header
      required: false
      description: '操作原因，写入审计日志（AUTH-18）。不带请求体的 DELETE 必须携带：值为 UTF-8 百分号编码，上限按解码后计算，为 1 到 500 个 Unicode 码点；`maxLength` 6000 是编码后的上限（500 个码点 × 每个码点最多 4 字节 × 每字节 3 个字符）。缺少、无法解码或超长返回 400 `invalid_request`（`errors[].field` 为 `Audit-Reason`）。'
      schema:
        type: string
        minLength: 1
        maxLength: 6000
      example: '%E5%91%98%E5%B7%A5%E7%A6%BB%E8%81%8C'
  headers:
    ETag:
      description: '强 ETag（CONV-13）'
      schema:
        type: string
      example: '"p-4f1c9a2e"'
    RetryAfter:
      description: '建议的重试等待秒数'
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: '错误（RFC 9457，CONV-16）'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://docs.example.invalid/problems/invalid_request'
            title: '参数错误'
            status: 400
            code: invalid_request
            request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
            errors:
            - field: amount_minor
              code: out_of_range
    NotModified:
      description: '未修改（If-None-Match 命中）'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    PreconditionRequired:
      description: '缺少 If-Match（CONV-28）'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://docs.example.invalid/problems/precondition_required'
            title: '缺少 If-Match 请求头'
            status: 428
            code: precondition_required
            request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
    RateLimited:
      description: '超过限流'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://docs.example.invalid/problems/rate_limited'
            title: '请求过于频繁'
            status: 429
            code: rate_limited
            request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
  schemas:
    Problem:
      type: object
      description: 'RFC 9457 problem details（CONV-16）'
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        challenge_id:
          type: string
          format: uuid
          description: '`mfa_required` 时附带：二次验证挑战 ID（5 分钟有效，AUTH-20）'
        methods:
          type: array
          items:
            type: string
            enum:
            - totp
            - passkey
            - recovery_code
          description: '`mfa_required` 时附带：可用的二次验证方式'
        totp_enrollment:
          $ref: '#/components/schemas/TotpEnrollment'
          description: '管理员尚未绑定 TOTP 时附带：本次登录需先完成绑定（AUTH-21、AUTH-22）'
        incompatible_inbounds:
          type: array
          items:
            $ref: '#/components/schemas/IncompatibleInbound'
          description: '`kernel_protocol_unsupported` 时附带：与目标内核不兼容的入站'
    FieldError:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
          description: '字段路径，如 `reality.short_ids`；请求头参数使用请求头名'
        code:
          $ref: '#/components/schemas/FieldErrorCode'
    ProblemCode:
      type: string
      enum:
      - invalid_request
      - unauthenticated
      - mfa_required
      - forbidden
      - email_unverified
      - registration_closed
      - account_suspended
      - not_found
      - conflict
      - invalid_state
      - quote_expired
      - entitlement_required
      - device_limit_reached
      - payment_unavailable
      - kernel_protocol_unsupported
      - payload_too_large
      - idempotency_key_reused
      - upgrade_required
      - precondition_required
      - rate_limited
      - internal
      - service_unavailable
      description: '错误码，取值见 spec/02 CONV-16，与客户端接口相同'
    FieldErrorCode:
      type: string
      enum:
      - required
      - invalid_format
      - too_short
      - too_long
      - out_of_range
      - not_allowed
      - invalid_code
      - incorrect
      - expired
      - exhausted
      - taken
      description: '`errors[].code`，取值见 spec/02 CONV-16；`taken`（取值已被占用）只用于管理接口'
    OAuthError:
      type: object
      description: 'RFC 6749 §5.2 错误响应（CONV-16 的唯一例外）'
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_grant
          - invalid_client
          - unsupported_grant_type
        error_description:
          type: string
    Permission:
      type: string
      enum:
      - accounts.read
      - accounts.adjust
      - credits.adjust
      - orders.read
      - orders.refund
      - 'plans.*'
      - 'location-groups.*'
      - 'hosts.*'
      - kernels.write
      - 'coupons.*'
      - 'content.*'
      - 'tickets.*'
      - payments.configure
      - settings.read
      - settings.write
      - 'staff.*'
      - audit.read
      - '*'
      description: '权限目录（spec/10 AUTH-17）；`*` 只出现在内置角色 superadmin 上'
    LocalizedText:
      type: object
      description: '按语言区分的文本，键为 BCP 47 语言标签'
      additionalProperties:
        type: string
      minProperties: 1
    TotpEnrollment:
      type: object
      required:
      - secret
      - otpauth_uri
      properties:
        secret:
          type: string
          description: 'Base32 编码的 TOTP 密钥，只在本次响应中出现'
        otpauth_uri:
          type: string
    PasswordLogin:
      type: object
      description: '第一步：邮箱与密码'
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        captcha_token:
          type: string
    MfaChallengeAnswer:
      type: object
      description: '第二步：提交挑战 ID 与三者之一，不再提交密码（AUTH-20）'
      required:
      - challenge_id
      properties:
        challenge_id:
          type: string
          format: uuid
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
        recovery_code:
          type: string
        webauthn_assertion:
          type: object
          description: 'WebAuthn 断言（M4）'
    ConsoleSession:
      type: object
      description: '令牌不出现在响应体中，只以 Set-Cookie 下发'
      required:
      - session_id
      - access_expires_at
      - refresh_expires_at
      - staff
      properties:
        session_id:
          type: string
          format: uuid
        access_expires_at:
          type: string
          format: date-time
          description: '访问令牌（Cookie `__Host-console_access_token`）的失效时间，15 分钟'
        refresh_expires_at:
          type: string
          format: date-time
          description: '刷新令牌（Cookie `__Host-console_refresh_token`）的绝对失效时间，自登录起 12 小时'
        staff:
          $ref: '#/components/schemas/StaffMe'
        recovery_codes:
          type: array
          items:
            type: string
          description: '本次登录同时完成 TOTP 绑定时返回的 10 个恢复码，只返回一次'
    SessionRefresh:
      type: object
      description: '令牌不出现在响应体中，只以 Set-Cookie 下发'
      required:
      - session_id
      - access_expires_at
      - refresh_expires_at
      properties:
        session_id:
          type: string
          format: uuid
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
          description: '绝对失效时间不因轮换而延长'
    StepUpRequest:
      type: object
      description: '提交 TOTP 码或 Passkey 断言之一（恢复码不可用于 step-up）'
      properties:
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
        webauthn_assertion:
          type: object
          description: 'WebAuthn 断言（M4）'
      minProperties: 1
      maxProperties: 1
    MfaAssertion:
      type: object
      required:
      - mfa_assertion
      - expires_at
      properties:
        mfa_assertion:
          type: string
          description: '放入 `Mfa-Assertion` 请求头的短期令牌'
        expires_at:
          type: string
          format: date-time
    StaffMe:
      type: object
      required:
      - account_id
      - email
      - roles
      - permissions
      - is_superadmin
      - has_totp
      - has_passkey
      properties:
        account_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        is_superadmin:
          type: boolean
        has_totp:
          type: boolean
        has_passkey:
          type: boolean
    InvitationAcceptance:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: '邀请邮件链接中的一次性令牌（72 小时有效）'
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: '被邀请邮箱尚无账号时必填，用于创建账号'
    AccountSummary:
      type: object
      required:
      - id
      - email
      - status
      - is_email_verified
      - entitlement_status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - suspended
          - deleting
          - deleted
        is_email_verified:
          type: boolean
        entitlement_status:
          type: string
          enum:
          - none
          - free
          - active
          - over_quota
          - suspended
          description: '免费账号为 `none` 或 `free`（spec/11 11.1）'
        plan:
          anyOf:
          - $ref: '#/components/schemas/PlanRef'
          - type: 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    Account:
      allOf:
      - $ref: '#/components/schemas/AccountSummary'
      - type: object
        required:
        - locale
        - referral_code
        - is_auto_renew
        - has_totp
        - roles
        - balance_minor
        - currency
        - device_count
        - device_limit
        - recent_usage
        - updated_at
        properties:
          locale:
            type: string
          timezone:
            type:
            - string
            - 'null'
          referral_code:
            type: string
          referred_by:
            type:
            - string
            - 'null'
            format: uuid
          is_auto_renew:
            type: boolean
          has_totp:
            type: boolean
          roles:
            type: array
            items:
              type: string
          balance_minor:
            type: integer
            format: int64
          currency:
            type: string
