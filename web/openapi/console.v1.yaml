# SPDX-License-Identifier: Apache-2.0
openapi: '3.1.0'
info:
  title: 'Console API'
  version: '0.1.0'
  description: |-
    管理后台（admin）使用的管理接口。规则见 spec/31，命名、分页、错误等通用约定见 spec/02 与 spec/30 API-01。

    ## 认证

    - 只接受受众（`aud`）为 `console` 的 PASETO v4.public 访问令牌。这种令牌只能由本接口的 `POST /v1/sessions` 签发，且本次登录必须完成二次验证（令牌带 `amr` 声明，spec/10 AUTH-21）。客户端接口签发的令牌、设备授权与扫码登录签发的令牌一律返回 401 `unauthenticated`。
    - 浏览器认证的方式与客户端接口的用户中心相同，令牌不出现在响应体中；但使用独立的 Cookie 名：访问令牌与刷新令牌分别放在 `__Host-console_access_token`、`__Host-console_refresh_token` Cookie（HttpOnly、Secure、SameSite=Strict、Path=/）中，避免与用户中心同主机按路径前缀部署时互相覆盖（spec/10 AUTH-08）。刷新令牌自登录起 12 小时绝对失效、空闲 30 分钟失效，通过 `POST /v1/oauth/token` 轮换。

    ## 权限（`x-permission`）

    - 每个操作以 `x-permission` 声明执行所需的一个权限，取值只能来自 spec/10 AUTH-17 的权限目录，由 CI 校验，中间件统一校验；`资源.*` 覆盖该资源的全部操作（包括只读操作）。缺少权限返回 403 `forbidden`。
    - `none`：认证类接口，不需要权限（登录、刷新、登出、step-up 等）。
    - `superadmin`：只有 superadmin 角色可以执行，任何角色都不能被授予（手动标记支付，AUTH-22、ORD-12）。

    ## 敏感操作（`x-sensitive: true`）

    spec/10 AUTH-19 列出的敏感操作要求：请求体带 `reason`（不带请求体的 DELETE 改用请求头 `Audit-Reason`）；请求头带 `Mfa-Assertion`（5 分钟内由 `POST /v1/staff/me/step-up` 完成 TOTP 或 Passkey 验证后取得），缺少或过期返回 401 `mfa_required`；界面二次确认（spec/32 UI-03）。执行者还必须拥有 `x-permission` 所列权限。

    ## 通用约定

    - 所有写操作写审计日志（CON-03）。
    - 列表为游标分页：`?limit=50&cursor=...`，响应 `{items, next_cursor}`，最后一页 `next_cursor` 为 `null`；非法游标返回 400 `invalid_request`（CONV-11）。
    - 产生副作用的 `POST` 接受 `Idempotency-Key`（CONV-12）。
    - CONV-13 所列资源（套餐、价格、线路组、节点、入站、路由、支付渠道、设置、角色、通知模板）的单个 `GET` 返回强 `ETag` 并支持 `If-None-Match`；其 `PUT`、`PATCH`、`DELETE` 必须带 `If-Match`：缺少返回 428 `precondition_required`，不一致返回 409 `conflict`（CONV-28）。
    - 错误为 `application/problem+json`（CONV-16）；`/v1/oauth/*` 例外。不存在与无权查看一律返回 404（CONV-15）。
    - 对外把节点称为 `hosts`（CON-04）。
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: 'https://console.example.invalid'
  description: '独立域名或配置的路径前缀（CON-01）'
security:
- cookie: []
tags:
- name: auth
  description: '管理员登录、令牌与重新验证'
- name: accounts
  description: '账号、会话、设备'
- name: entitlements
  description: '权益与权益事件'
- name: credits
  description: '余额'
- name: plans
  description: '套餐、价格、加购项、应用到现有用户'
- name: location-groups
  description: '线路组'
- name: hosts
  description: '节点、接入、入站、路由、内核'
- name: kernels
  description: '内核能力矩阵'
- name: orders
  description: '订单、退款、手动标记支付'
- name: payments
  description: '支付渠道与支付通知'
- name: coupons
  description: '优惠券与兑换码'
- name: content
  description: '公告与帮助文档'
- name: support
  description: '工单'
- name: notifications
  description: '通知模板'
- name: referrals
  description: '邀请返利'
- name: settings
  description: '系统设置'
- name: staff
  description: '管理员、邀请与角色'
- name: audit
  description: '审计日志'
- name: metrics
  description: '看板'
paths:
  /v1/sessions:
    post:
      tags:
      - auth
      operationId: createSession
      summary: '管理员登录（必须完成二次验证）'
      description: |-
        两步登录，逻辑同客户端接口的 AUTH-20，但本次登录必须完成二次验证（AUTH-21）：

        1. 提交邮箱与密码。密码正确时一律返回 401 `mfa_required`，附 `challenge_id` 与 `methods`；管理员尚未绑定 TOTP（首次登录）时另附 `totp_enrollment`（AUTH-22）。非管理员账号返回 403 `forbidden`。
        2. 提交 `challenge_id` 与 `totp_code`、`recovery_code`、`webauthn_assertion` 三者之一，不再提交密码。首次绑定时只接受 `totp_code`，成功后响应附 10 个恢复码。

        成功时签发受众为 `console` 的访问令牌。令牌不出现在响应体中：访问令牌与刷新令牌分别以 `__Host-console_access_token`、`__Host-console_refresh_token` Cookie（HttpOnly、Secure、SameSite=Strict，Path=/）下发；刷新令牌 12 小时绝对失效、空闲 30 分钟失效（AUTH-21）。每个 challenge 最多尝试 5 次，失败次数计入 AUTH-09 的登录限流。
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PasswordLogin'
              - $ref: '#/components/schemas/MfaChallengeAnswer'
            examples:
              password:
                summary: '第一步'
                value:
                  email: 'ops@example.com'
                  password: correct-horse-battery
              totp:
                summary: '第二步'
                value:
                  challenge_id: '01927c3e-8a41-7030-9d3e-5f6a7b8c0030'
                  totp_code: '492871'
      responses:
        '201':
          description: '登录成功'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSession'
              example:
                session_id: '01927c3e-8a41-7026-9d3e-5f6a7b8c0026'
                access_expires_at: '2026-09-23T10:30:00+08:00'
                refresh_expires_at: '2026-09-23T22:15:00+08:00'
                staff:
                  account_id: '01927c3e-8a41-7003-9d3e-5f6a7b8c0003'
                  email: 'ops@example.com'
                  roles:
                  - operator
                  permissions:
                  - accounts.read
                  - accounts.adjust
                  - orders.read
                  - 'plans.*'
                  - 'location-groups.*'
                  - 'hosts.*'
                  - kernels.write
                  - 'coupons.*'
                  - 'content.*'
                  is_superadmin: false
                  has_totp: true
                  has_passkey: false
          headers:
            Set-Cookie:
              description: '两个 Cookie：`__Host-console_access_token`（访问令牌，Max-Age=900）与 `__Host-console_refresh_token`（刷新令牌），均为 HttpOnly、Secure、SameSite=Strict、Path=/（AUTH-08、AUTH-21）'
              schema:
                type: string
              example: '__Host-console_access_token=v4.public.eyJhdWQiOiJjb25zb2xlIn0.c2ln; Max-Age=900; Path=/; Secure; HttpOnly; SameSite=Strict'
        '401':
          description: '需要二次验证，或凭据错误'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                mfa_required:
                  summary: '需要二次验证'
                  value:
                    type: 'https://docs.example.invalid/problems/mfa_required'
                    title: '需要二次验证'
                    status: 401
                    code: mfa_required
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                    challenge_id: '01927c3e-8a41-7030-9d3e-5f6a7b8c0030'
                    methods:
                    - totp
                    - recovery_code
                totp_enrollment:
                  summary: '首次登录需绑定 TOTP'
                  value:
                    type: 'https://docs.example.invalid/problems/mfa_required'
                    title: '需要绑定 TOTP'
                    status: 401
                    code: mfa_required
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                    challenge_id: '01927c3e-8a41-7030-9d3e-5f6a7b8c0030'
                    methods:
                    - totp
                    totp_enrollment:
                      secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                      otpauth_uri: 'otpauth://totp/Akari%20Console:ops%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Akari%20Console'
                unauthenticated:
                  summary: '邮箱或密码错误'
                  value:
                    type: 'https://docs.example.invalid/problems/unauthenticated'
                    title: '邮箱或密码错误'
                    status: 401
                    code: unauthenticated
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/current:
    delete:
      tags:
      - auth
      operationId: deleteCurrentSession
      summary: '登出'
      description: '吊销当前管理会话，并以过期的 Set-Cookie 清除 `__Host-console_access_token` 与 `__Host-console_refresh_token`。'
      x-permission: none
      responses:
        '204':
          description: '已登出'
          headers:
            Set-Cookie:
              description: '以 Max-Age=0 清除 `__Host-console_access_token` 与 `__Host-console_refresh_token`'
              schema:
                type: string
              example: '__Host-console_access_token=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Strict'
        '401':
          description: '令牌无效'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unauthenticated:
                  summary: '令牌失效'
                  value:
                    type: 'https://docs.example.invalid/problems/unauthenticated'
                    title: '未登录或令牌失效'
                    status: 401
                    code: unauthenticated
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
        default:
          $ref: '#/components/responses/Problem'
  /v1/oauth/token:
    post:
      tags:
      - auth
      operationId: refreshToken
      summary: '刷新访问令牌'
      description: '只支持 `grant_type=refresh_token`（AUTH-21）。刷新令牌由 `__Host-console_refresh_token` Cookie 携带，不在表单中提交；每次使用即轮换（AUTH-07），新的访问令牌与刷新令牌同样以 Set-Cookie 下发，不出现在响应体中。错误按 RFC 6749 §5.2 返回 `application/json`（CONV-16 例外）；`default` 只用于限流、服务不可用等非 OAuth 错误。'
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                  - refresh_token
              additionalProperties: false
            example:
              grant_type: refresh_token
      responses:
        '200':
          description: '已轮换'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefresh'
              example:
                session_id: '01927c3e-8a41-7026-9d3e-5f6a7b8c0026'
                access_expires_at: '2026-09-23T10:30:00+08:00'
                refresh_expires_at: '2026-09-23T21:00:00+08:00'
          headers:
            Set-Cookie:
              description: '两个 Cookie：`__Host-console_access_token`（访问令牌，Max-Age=900）与 `__Host-console_refresh_token`（刷新令牌），均为 HttpOnly、Secure、SameSite=Strict、Path=/（AUTH-08、AUTH-21）'
              schema:
                type: string
              example: '__Host-console_access_token=v4.public.eyJhdWQiOiJjb25zb2xlIn0.c2ln; Max-Age=900; Path=/; Secure; HttpOnly; SameSite=Strict'
            Cache-Control:
              description: '`no-store`（RFC 6749 §5.1）'
              schema:
                type: string
              example: no-store
        '400':
          description: 'OAuth 错误'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_grant
                error_description: '刷新令牌已失效'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me:
    get:
      tags:
      - auth
      operationId: getCurrentStaff
      summary: '当前管理员与权限'
      description: '返回当前管理员的角色与展开后的权限，供管理后台决定菜单与按钮。'
      x-permission: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
              example:
                account_id: '01927c3e-8a41-7003-9d3e-5f6a7b8c0003'
                email: 'ops@example.com'
                roles:
                - operator
                permissions:
                - accounts.read
                - accounts.adjust
                - orders.read
                - 'plans.*'
                - 'location-groups.*'
                - 'hosts.*'
                - kernels.write
                - 'coupons.*'
                - 'content.*'
                is_superadmin: false
                has_totp: true
                has_passkey: false
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/step-up:
    post:
      tags:
      - auth
      operationId: createStepUp
      summary: '重新验证，取得 Mfa-Assertion'
      description: '完成一次 TOTP 或 Passkey 验证，返回 5 分钟有效的短期令牌，放入敏感操作的 `Mfa-Assertion` 请求头（AUTH-19）。失败次数计入 AUTH-09 的账号失败次数。'
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
            example:
              totp_code: '492871'
      responses:
        '201':
          description: '已验证'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaAssertion'
              example:
                mfa_assertion: v4.public.eyJwdXJwb3NlIjoic3RlcF91cCJ9.c2ln
                expires_at: '2026-09-23T10:20:00+08:00'
        '400':
          description: '验证失败'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                incorrect:
                  summary: '验证码错误'
                  value:
                    type: 'https://docs.example.invalid/problems/invalid_request'
                    title: '参数错误'
                    status: 400
                    code: invalid_request
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                    errors:
                    - field: totp_code
                      code: incorrect
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff-invitations/acceptance:
    post:
      tags:
      - auth
      operationId: acceptStaffInvitation
      summary: '接受管理员邀请'
      description: '被邀请人打开邀请链接后调用。邮箱尚无账号时用 `password` 创建账号；之后通过 `POST /v1/sessions` 登录，首次登录时强制绑定 TOTP（AUTH-22）。令牌无效或过期返回 400，`errors[].code` 为 `invalid_code` 或 `expired`。'
      security: []
      x-permission: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
            example:
              token: inv_8fJ2kQ0zX4vN6pL1
              password: correct-horse-battery
      responses:
        '200':
          description: '已加入'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                account_id: '01927c3e-8a41-7004-9d3e-5f6a7b8c0004'
                email: 'new.ops@example.com'
                roles:
                - operator
                has_totp: false
                has_passkey: false
                last_login_at: null
                created_at: '2026-09-23T10:15:00+08:00'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts:
    get:
      tags:
      - accounts
      operationId: listAccounts
      summary: '搜索账号'
      x-permission: accounts.read
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: '按邮箱、账号 ID、邀请码或订单号搜索'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - suspended
          - deleting
          - deleted
      - name: entitlement_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - free
          - active
          - over_quota
          - suspended
      - name: plan_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSummary'
                  next_cursor:
                    type:
                    - string
                    - 'null'
              example:
                items:
                - id: '01927c3e-8a41-7001-9d3e-5f6a7b8c0001'
                  email: 'lin.wei@example.com'
                  status: active
                  is_email_verified: true
                  entitlement_status: active
                  plan:
                    id: '01927c3e-8a41-7005-9d3e-5f6a7b8c0005'
                    name: '标准版'
                    tier: 2
                    kind: recurring
                  expires_at: '2026-10-23T10:15:00+08:00'
                  created_at: '2026-03-02T09:12:44+08:00'
                  last_seen_at: '2026-09-23T09:58:12+08:00'
                - id: '01927c3e-8a41-7002-9d3e-5f6a7b8c0002'
                  email: 'zhao.min@example.org'
                  status: suspended
                  is_email_verified: true
                  entitlement_status: none
                  plan: null
                  expires_at: null
                  created_at: '2026-05-11T20:03:10+08:00'
                  last_seen_at: '2026-09-01T12:40:00+08:00'
                next_cursor: eyJrIjoiMjAyNi0wOS0yM1QxMDoxNTowMCswODowMCIsImlkIjoiMDE5MjdjM2UifQ
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - accounts
      operationId: createAccount
      summary: '创建账号'
      description: '由管理员代为创建账号。邮箱已被占用返回 400 `invalid_request`，`errors[].code` 为 `taken`。'
      x-permission: accounts.adjust
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            example:
              email: 'zhang.lei@example.com'
              is_email_verified: true
              reason: '企业客户线下开户'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: '01927c3e-8a41-7002-9d3e-5f6a7b8c0002'
                email: 'zhang.lei@example.com'
                status: active
                is_email_verified: true
                entitlement_status: active
                plan:
                  id: '01927c3e-8a41-7005-9d3e-5f6a7b8c0005'
                  name: '标准版'
                  tier: 2
                  kind: recurring
                expires_at: '2026-10-23T10:15:00+08:00'
                created_at: '2026-03-02T09:12:44+08:00'
                last_seen_at: '2026-09-23T09:58:12+08:00'
                locale: zh-CN
                timezone: Asia/Shanghai
                referral_code: K7Q2XM9A
                referred_by: null
                is_auto_renew: true
                has_totp: false
                roles: []
                balance_minor: 1250
                currency: CNY
                device_count: 2
                device_limit: 3
                recent_usage:
                - date: '2026-09-22'
                  bytes_up: 327155712
                  bytes_down: 4294967296
                - date: '2026-09-23'
                  bytes_up: 100663296
                  bytes_down: 1288490188
                updated_at: '2026-09-20T18:22:05+08:00'
        '400':
          description: '参数错误'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                taken:
                  summary: '邮箱已被占用'
                  value:
                    type: 'https://docs.example.invalid/problems/invalid_request'
                    title: '参数错误'
                    status: 400
                    code: invalid_request
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                    errors:
                    - field: email
                      code: taken
