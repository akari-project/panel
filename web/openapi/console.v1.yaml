            description: '最近 7 天每日用量（accounts.read 可见范围）'
          updated_at:
            type: string
            format: date-time
    DailyUsage:
      type: object
      required:
      - date
      - bytes_up
      - bytes_down
      properties:
        date:
          type: string
          format: date
        bytes_up:
          type: integer
          format: int64
        bytes_down:
          type: integer
          format: int64
    PlanRef:
      type: object
      required:
