        listen_port:
          type: integer
          minimum: 1
          maximum: 65535
        settings:
          type: object
          description: '入站配置，不含密钥。控制面把 `settings` 与 `secrets` 深度合并后，按 `schemas/inbound/<protocol>-<transport>.schema.json` 校验合并结果（AGT-13）'
