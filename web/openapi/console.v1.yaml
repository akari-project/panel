      operationId: switchHostKernel
      summary: '切换节点内核'
      description: |-
        设置控制面为该节点选定的内核（AGT-07），随 `InboundApply` 下发；Agent 切换失败时回退并在 `last_switch_error` 中报告。已启用的入站有任一不被目标内核支持时返回 409 `kernel_protocol_unsupported`，并在 `incompatible_inbounds` 中列出；执行前应调用 `POST /v1/hosts/{id}/impact`。`If-Match` 使用 `GET /v1/hosts/{id}/kernel` 返回的 ETag。

        敏感操作（spec/10 AUTH-19）：请求体必须带 `reason`，请求头必须带 `Mfa-Assertion`；`Mfa-Assertion` 缺少或过期返回 401 `mfa_required`。

        必须携带 `If-Match`：缺少返回 428 `precondition_required`，与当前 ETag 不一致返回 409 `conflict`（CONV-28）。
      x-permission: kernels.write
      x-sensitive: true
      parameters:
      - name: id
        in: path
        required: true
        description: '节点 ID'
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/MfaAssertion'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostKernelUpdate'
            example:
              kernel: xray
              reason: '该机房需要 XHTTP 传输'
      responses:
