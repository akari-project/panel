          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - payments
      operationId: updateAlipayF2f
      summary: '修改支付宝当面付配置'
      description: |-
        结算货币不是 CNY 时启用返回 409 `invalid_state`（PAY-03）。`app_private_key` 只写，审计记录中只记“已修改”。

        敏感操作（spec/10 AUTH-19）：请求体必须带 `reason`，请求头必须带 `Mfa-Assertion`；`Mfa-Assertion` 缺少或过期返回 401 `mfa_required`。

        必须携带 `If-Match`：缺少返回 428 `precondition_required`，与当前 ETag 不一致返回 409 `conflict`（CONV-28）。
      x-permission: payments.configure
      x-sensitive: true
      parameters:
      - $ref: '#/components/parameters/MfaAssertion'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlipayF2fUpdate'
            example:
              payment_timeout_minutes: 30
              app_private_key: |-
                -----BEGIN PRIVATE KEY-----
                MIIEvQ...
                -----END PRIVATE KEY-----
              reason: '更换应用私钥'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlipayF2fConfig'
              example:
                is_enabled: true
                environment: production
                app_id: '2021004123456789'
                sign_mode: public_key
                alipay_public_key: 
                app_public_cert: null
                alipay_public_cert: null
                alipay_root_cert: null
                has_app_private_key: true
                notify_url: 'https://api.example.com/v1/payment-callbacks/alipay-f2f'
                notify_url_override: null
                subject_template: '{site}-{plan}-{period}'
                payment_timeout_minutes: 30
                updated_by: '01927c3e-8a41-7003-9d3e-5f6a7b8c0003'
                updated_at: '2026-08-30T15:00:00+08:00'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '409':
          description: '冲突'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid_state:
                  summary: '状态不允许'
                  value:
                    type: 'https://docs.example.invalid/problems/invalid_state'
                    title: '当前状态不允许该操作'
                    status: 409
                    code: invalid_state
                    detail: '站点结算货币不是 CNY，不能启用支付宝当面付'
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                conflict:
                  summary: 'ETag 不一致'
                  value:
                    type: 'https://docs.example.invalid/problems/conflict'
                    title: '资源已被修改'
                    status: 409
                    code: conflict
                    detail: '资源已被其他管理员修改，请重新读取后重试'
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Problem'
