          description: '已设定，等待节点应用'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostKernel'
              example:
                host_id: '01927c3e-8a41-7010-9d3e-5f6a7b8c0010'
                kernel: xray
                running_kernel: singbox
                running_version: '1.13.2'
                available_kernels:
                - singbox
                - xray
                last_switch_error: null
                config_version: 1843
                applied_config_version: 1842
                updated_at: '2026-09-23T10:15:00+08:00'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '409':
          description: '冲突'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                kernel_protocol_unsupported:
                  summary: '内核不支持'
                  value:
                    type: 'https://docs.example.invalid/problems/kernel_protocol_unsupported'
                    title: '节点内核不支持该协议或传输'
                    status: 409
                    code: kernel_protocol_unsupported
                    detail: 'xray 不支持 tuic 协议'
                    request_id: '01927c3f-0b12-7c55-8d10-2f3e4a5b6c7d'
                    incompatible_inbounds:
                    - inbound_id: '01927c3e-8a41-7015-9d3e-5f6a7b8c0015'
                      host_id: '01927c3e-8a41-7010-9d3e-5f6a7b8c0010'
                      protocol: tuic
