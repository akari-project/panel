# 前端检查（spec/42 42.2 前端部分）：SDK 生成结果最新、禁用词、lint、类型检查、单元测试、构建、端到端测试。
name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANEL_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # OpenAPI 拷贝与 lock.json 一致、生成的 SDK 是最新的；接口变更导致的类型错误由随后的 typecheck 暴露。
      - run: pnpm gen:check
      - run: pnpm lint:terms
      - run: pnpm lint:root
      - run: pnpm typecheck:root
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: 产物只使用相对路径
        run: |
          ! grep -nE '(src|href)="/[^/]' portal/dist/index.html admin/dist/index.html
          grep -q '<!--panel-config-->' portal/dist/index.html
          grep -q '<!--panel-config-->' admin/dist/index.html
          test "$(jq -r .commit portal/dist/build.json)" = "$PANEL_BUILD_COMMIT"
          test "$(jq -r .commit admin/dist/build.json)" = "$PANEL_BUILD_COMMIT"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
